<script>
"use strict";
(function(){
// ===== 基本設定 =====
const W=400,H=600;                 // 邏輯畫布尺寸（直式）
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let VS=1;                          // 目前的實體縮放（scale*dpr）
let cssScale=1;

function resize(){
  const dpr=Math.min(3,window.devicePixelRatio||1);
  const availW=window.innerWidth-8;
  const availH=window.innerHeight-34;
  const s=Math.max(0.3,Math.min(availW/W,availH/H));
  cssScale=s;
  cv.style.width=(W*s)+'px';
  cv.style.height=(H*s)+'px';
  cv.width=Math.round(W*s*dpr);
  cv.height=Math.round(H*s*dpr);
  VS=s*dpr;
  ctx.setTransform(VS,0,0,VS,0,0);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
resize();

// 螢幕座標 → 邏輯座標（一律用 getBoundingClientRect 換算）
function toLogic(clientX,clientY){
  const r=cv.getBoundingClientRect();
  return {x:(clientX-r.left)/r.width*W, y:(clientY-r.top)/r.height*H};
}

// ===== 音效（WebAudio 純合成，零外部資源） =====
let AC=null,masterGain=null;
function initAudio(){
  if(AC) return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    AC=new Ctx();
    masterGain=AC.createGain();
    masterGain.gain.value=0.5;
    masterGain.connect(AC.destination);
  }catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC) return;
  try{
    const t0=AC.currentTime+(delay||0);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol||0.2),t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(masterGain);
    o.start(t0);o.stop(t0+dur+0.03);
  }catch(e){}
}
function noise(dur,vol,filtFrom,filtTo,delay){
  if(!AC) return;
  try{
    const t0=AC.currentTime+(delay||0);
    const len=Math.max(1,Math.floor(AC.sampleRate*dur));
    const buf=AC.createBuffer(1,len,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=AC.createBufferSource();src.buffer=buf;
    const f=AC.createBiquadFilter();f.type='lowpass';
    f.frequency.setValueAtTime(filtFrom||1200,t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(60,filtTo||200),t0+dur);
    const g=AC.createGain();
    g.gain.setValueAtTime(vol||0.25,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f);f.connect(g);g.connect(masterGain);
    src.start(t0);src.stop(t0+dur+0.02);
  }catch(e){}
}
const SFX={
  aim(){ tone(520,0.05,'square',0.05); },
  launch(){ noise(0.18,0.16,2200,300); tone(280,0.16,'triangle',0.16,620); },
  thud(v){ const p=Math.min(1,v/500); noise(0.13,0.06+0.18*p,900+900*p,140); tone(90+40*p,0.1,'sine',0.05+0.1*p,50); },
  crack(){ noise(0.22,0.3,4200,400); tone(700,0.1,'square',0.08,180); },
  glass(){ noise(0.3,0.24,6000,900); tone(1500,0.14,'triangle',0.1,2600); tone(2100,0.1,'sine',0.07,3200,0.05); },
  boom(){ noise(0.45,0.45,1600,80); tone(120,0.4,'sawtooth',0.25,38); tone(60,0.5,'sine',0.2,30); },
  cat(n){ const b=440*Math.pow(1.14,Math.min(7,n||0));
    tone(b,0.1,'square',0.16,b*1.5); tone(b*2,0.16,'triangle',0.12,b*3,0.05); },
  star(i){ tone(660*Math.pow(1.26,i),0.16,'triangle',0.2); tone(990*Math.pow(1.26,i),0.2,'sine',0.12,undefined,0.03); },
  clear(){ [0,1,2,3].forEach((i)=>tone([523,659,784,1046][i],0.3,'triangle',0.18,undefined,i*0.09)); },
  fail(){ [0,1,2].forEach(i=>tone([392,330,247][i],0.28,'sawtooth',0.14,undefined,i*0.11)); },
  record(){ [0,1,2,3,4].forEach(i=>tone([523,659,784,1046,1319][i],0.4,'square',0.14,undefined,i*0.08)); },
  ui(){ tone(760,0.06,'square',0.09,980); }
};

// ===== 物理引擎（簡化剛體：OBB + 圓，序列衝量解算） =====
const G=1000;                 // 重力 px/s^2
const FDT=1/120;              // 固定時間步長
const ITER=12;                // 解算迭代次數
const SLOP=0.5, BETA=0.22;

let bodies=[],bodyId=1;
let warmPrev=new Map(),warmCur=new Map();

const MAT={
  wood :{d:0.0012,fric:.55,rest:.05,hp:22 ,c1:'#b8823f',c2:'#8a5c26'},
  stone:{d:0.0030,fric:.62,rest:.04,hp:1e9,c1:'#8d95a6',c2:'#5d6474'},
  ice  :{d:0.0010,fric:.14,rest:.10,hp:9  ,c1:'#a8e6ff',c2:'#5fb6d8'},
  bomb :{d:0.0014,fric:.55,rest:.06,hp:5  ,c1:'#3a3f52',c2:'#22252f'}
};

function addBox(x,y,w,h,mat,ang,isStatic){
  const m=MAT[mat]||MAT.wood;
  const b={id:bodyId++,shape:'box',x:x,y:y,a:ang||0,vx:0,vy:0,av:0,
    hw:w/2,hh:h/2,mat:mat,kind:'block',fric:m.fric,rest:m.rest,
    hp:m.hp,maxhp:m.hp,dead:false,static:!!isStatic,sleeping:false,sleepT:0,
    flash:0,dmgAcc:0};
  if(isStatic){b.invM=0;b.invI=0;b.mass=1e9;}
  else{const mass=w*h*m.d;b.mass=mass;b.invM=1/mass;b.invI=12/(mass*(w*w+h*h));}
  bodies.push(b);return b;
}
function addCircle(x,y,r,kind,dens,fric,rest,hp){
  const b={id:bodyId++,shape:'circle',x:x,y:y,a:0,vx:0,vy:0,av:0,r:r,
    kind:kind,mat:kind,fric:fric,rest:rest,hp:hp,maxhp:hp,dead:false,
    static:false,sleeping:false,sleepT:0,flash:0,dmgAcc:0,wob:Math.random()*6};
  const mass=Math.PI*r*r*dens;
  b.mass=mass;b.invM=1/mass;b.invI=2/(mass*r*r);
  bodies.push(b);return b;
}

function projRad(b,nx,ny){
  const c=Math.cos(b.a),s=Math.sin(b.a);
  return Math.abs(b.hw*(nx*c+ny*s))+Math.abs(b.hh*(-nx*s+ny*c));
}
function ptInBox(px,py,b,eps){
  const c=Math.cos(b.a),s=Math.sin(b.a),dx=px-b.x,dy=py-b.y;
  const lx=dx*c+dy*s,ly=-dx*s+dy*c;
  return Math.abs(lx)<=b.hw+eps&&Math.abs(ly)<=b.hh+eps;
}
function corners(b){
  const c=Math.cos(b.a),s=Math.sin(b.a);
  const ax=c*b.hw,ay=s*b.hw,bx=-s*b.hh,by=c*b.hh;
  return [[b.x+ax+bx,b.y+ay+by],[b.x-ax+bx,b.y-ay+by],[b.x-ax-bx,b.y-ay-by],[b.x+ax-bx,b.y+ay-by]];
}
// 盒對盒：SAT 找最小穿透軸，再用角點取接觸點
function boxBox(A,B){
  const ca=Math.cos(A.a),sa=Math.sin(A.a),cb=Math.cos(B.a),sb=Math.sin(B.a);
  const axes=[[ca,sa],[-sa,ca],[cb,sb],[-sb,cb]];
  const dx=B.x-A.x,dy=B.y-A.y;
  let best=-1e9,nx=0,ny=0;
  for(let i=0;i<4;i++){
    const ax=axes[i][0],ay=axes[i][1];
    const d=dx*ax+dy*ay;
    const sep=Math.abs(d)-(projRad(A,ax,ay)+projRad(B,ax,ay));
    if(sep>0) return null;
    if(sep>best){best=sep;nx=d<0?-ax:ax;ny=d<0?-ay:ay;}
  }
  const depth=-best;
  let pts=[];
  const cb2=corners(B);
  for(let i=0;i<4;i++) if(ptInBox(cb2[i][0],cb2[i][1],A,0.6)) pts.push([cb2[i][0],cb2[i][1]]);
  const ca2=corners(A);
  for(let i=0;i<4;i++) if(ptInBox(ca2[i][0],ca2[i][1],B,0.6)) pts.push([ca2[i][0],ca2[i][1]]);
  if(pts.length===0){
    pts=[[A.x+nx*projRad(A,nx,ny),A.y+ny*projRad(A,nx,ny)]];
  }else if(pts.length>2){
    const tx=-ny,ty=nx;
    pts.sort((p,q)=>(p[0]*tx+p[1]*ty)-(q[0]*tx+q[1]*ty));
    pts=[pts[0],pts[pts.length-1]];
  }
  return {nx:nx,ny:ny,depth:depth,pts:pts};
}
// 圓對盒：法線由盒指向圓
function circBox(C,B){
  const c=Math.cos(B.a),s=Math.sin(B.a);
  const dx=C.x-B.x,dy=C.y-B.y;
  const lx=dx*c+dy*s,ly=-dx*s+dy*c;
  const clx=Math.max(-B.hw,Math.min(B.hw,lx)),cly=Math.max(-B.hh,Math.min(B.hh,ly));
  let nlx,nly,depth;
  if(clx===lx&&cly===ly){
    const px=B.hw-Math.abs(lx),py=B.hh-Math.abs(ly);
    if(px<py){nlx=lx<0?-1:1;nly=0;depth=C.r+px;}
    else{nlx=0;nly=ly<0?-1:1;depth=C.r+py;}
  }else{
    let ox=lx-clx,oy=ly-cly,d=Math.hypot(ox,oy);
    if(d>C.r) return null;
    if(d<1e-9){ox=0;oy=-1;d=1;}
    nlx=ox/d;nly=oy/d;depth=C.r-d;
  }
  const nx=nlx*c-nly*s, ny=nlx*s+nly*c;
  const px=C.x-nx*(C.r-depth*0.5), py=C.y-ny*(C.r-depth*0.5);
  return {nx:nx,ny:ny,depth:depth,pts:[[px,py]]};
}
function collide(A,B){
  if(A.shape==='box'&&B.shape==='box') return boxBox(A,B);
  if(A.shape==='circle'&&B.shape==='circle'){
    const dx=B.x-A.x,dy=B.y-A.y;let d=Math.hypot(dx,dy);
    const depth=A.r+B.r-d; if(depth<=0) return null;
    if(d<1e-9){d=1;}
    const nx=dx/d,ny=dy/d;
    return {nx:nx,ny:ny,depth:depth,pts:[[A.x+nx*(A.r-depth*0.5),A.y+ny*(A.r-depth*0.5)]]};
  }
  if(A.shape==='circle'){
    const r=circBox(A,B); if(!r) return null;
    return {nx:-r.nx,ny:-r.ny,depth:r.depth,pts:r.pts};
  }
  const r=circBox(B,A); if(!r) return null;
  return {nx:r.nx,ny:r.ny,depth:r.depth,pts:r.pts};
}
function velAt(b,rx,ry,out){ out[0]=b.vx-b.av*ry; out[1]=b.vy+b.av*rx; }
function applyImp(b,ix,iy,rx,ry){
  if(b.static) return;
  b.vx+=ix*b.invM; b.vy+=iy*b.invM; b.av+=b.invI*(rx*iy-ry*ix);
}
function aabbHit(a,b){
  const ra=a.shape==='circle'?a.r:Math.hypot(a.hw,a.hh);
  const rb=b.shape==='circle'?b.r:Math.hypot(b.hw,b.hh);
  return Math.abs(a.x-b.x)<ra+rb+2 && Math.abs(a.y-b.y)<ra+rb+2;
}

const vA=[0,0],vB=[0,0];
function physStep(dt){
  // 1) 速度積分（重力＋阻尼）
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i];
    if(b.static||b.sleeping) continue;
    b.vy+=G*dt; b.vx*=0.9992; b.vy*=0.9992; b.av*=0.995;
  }
  // 2) 產生接觸點
  const cts=[];
  for(let i=0;i<bodies.length;i++){
    const A=bodies[i]; if(A.dead) continue;
    for(let j=i+1;j<bodies.length;j++){
      const B=bodies[j]; if(B.dead) continue;
      if((A.static||A.sleeping)&&(B.static||B.sleeping)) continue;
      if(!aabbHit(A,B)) continue;
      const m=collide(A,B); if(!m) continue;
      // 撞擊傷害：用接近速度判定（靜置不扣血）
      const rx=m.pts[0][0]-A.x, ry=m.pts[0][1]-A.y;
      const rx2=m.pts[0][0]-B.x, ry2=m.pts[0][1]-B.y;
      velAt(A,rx,ry,vA); velAt(B,rx2,ry2,vB);
      const vn=(vB[0]-vA[0])*m.nx+(vB[1]-vA[1])*m.ny;
      if(vn<-95){
        const dmg=(-vn-90)/45;
        A.dmgAcc+=dmg; B.dmgAcc+=dmg;
        if(-vn>150 && impactCooldown<=0){ SFX.thud(-vn); impactCooldown=0.045;
          spawnDust(m.pts[0][0],m.pts[0][1],Math.min(6,1+(-vn)/180)); }
      }
      // 喚醒
      if(!A.sleeping||!B.sleeping){A.sleeping=false;A.sleepT=0;B.sleeping=false;B.sleepT=0;}
      const mu=Math.sqrt(A.fric*B.fric);
      const e=Math.max(A.rest,B.rest);
      for(let k=0;k<m.pts.length;k++){
        const px=m.pts[k][0],py=m.pts[k][1];
        const rax=px-A.x,ray=px*0+py-A.y,rbx=px-B.x,rby=py-B.y;
        const rnA=rax*m.ny-ray*m.nx, rnB=rbx*m.ny-rby*m.nx;
        const kn=A.invM+B.invM+A.invI*rnA*rnA+B.invI*rnB*rnB;
        const tx=-m.ny,ty=m.nx;
        const rtA=rax*ty-ray*tx, rtB=rbx*ty-rby*tx;
        const kt=A.invM+B.invM+A.invI*rtA*rtA+B.invI*rtB*rtB;
        velAt(A,rax,ray,vA); velAt(B,rbx,rby,vB);
        const relN=(vB[0]-vA[0])*m.nx+(vB[1]-vA[1])*m.ny;
        const key=A.id+'_'+B.id+'_'+k;
        const prev=warmPrev.get(key);
        cts.push({A:A,B:B,nx:m.nx,ny:m.ny,tx:tx,ty:ty,px:px,py:py,
          rax:rax,ray:ray,rbx:rbx,rby:rby,
          mN:kn>0?1/kn:0,mT:kt>0?1/kt:0,mu:mu,
          bias:(BETA/dt)*Math.min(4,Math.max(0,m.depth-SLOP)),
          rb:relN<-70?-e*relN:0,
          jn:prev?prev.jn*0.85:0, jt:prev?prev.jt*0.85:0, key:key});
      }
    }
  }
  // 3) warm start
  for(let i=0;i<cts.length;i++){
    const c=cts[i];
    const ix=c.nx*c.jn+c.tx*c.jt, iy=c.ny*c.jn+c.ty*c.jt;
    applyImp(c.A,-ix,-iy,c.rax,c.ray); applyImp(c.B,ix,iy,c.rbx,c.rby);
  }
  // 4) 迭代解算
  for(let it=0;it<ITER;it++){
    for(let i=0;i<cts.length;i++){
      const c=cts[i];
      velAt(c.A,c.rax,c.ray,vA); velAt(c.B,c.rbx,c.rby,vB);
      let vn=(vB[0]-vA[0])*c.nx+(vB[1]-vA[1])*c.ny;
      let dj=c.mN*(-vn+c.bias+c.rb);
      const old=c.jn; c.jn=Math.max(0,old+dj); dj=c.jn-old;
      applyImp(c.A,-c.nx*dj,-c.ny*dj,c.rax,c.ray);
      applyImp(c.B,c.nx*dj,c.ny*dj,c.rbx,c.rby);
      velAt(c.A,c.rax,c.ray,vA); velAt(c.B,c.rbx,c.rby,vB);
      let vt=(vB[0]-vA[0])*c.tx+(vB[1]-vA[1])*c.ty;
      let dt2=c.mT*(-vt);
      const maxF=c.mu*c.jn, oldT=c.jt;
      c.jt=Math.max(-maxF,Math.min(maxF,oldT+dt2)); dt2=c.jt-oldT;
      applyImp(c.A,-c.tx*dt2,-c.ty*dt2,c.rax,c.ray);
      applyImp(c.B,c.tx*dt2,c.ty*dt2,c.rbx,c.rby);
    }
  }
  warmCur.clear();
  for(let i=0;i<cts.length;i++) warmCur.set(cts[i].key,{jn:cts[i].jn,jt:cts[i].jt});
  const tmp=warmPrev; warmPrev=warmCur; warmCur=tmp;
  // 5) 位置積分＋睡眠
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i];
    if(b.static||b.sleeping) continue;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.a+=b.av*dt;
    const sp=Math.hypot(b.vx,b.vy);
    if(sp<9&&Math.abs(b.av)<0.18){ b.sleepT+=dt; if(b.sleepT>0.45){b.sleeping=true;b.vx=0;b.vy=0;b.av=0;} }
    else b.sleepT=0;
  }
}
function worldSettled(){
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i];
    if(b.static||b.dead) continue;
    if(b.sleeping) continue;
    if(Math.hypot(b.vx,b.vy)>14||Math.abs(b.av)>0.4) return false;
  }
  return true;
}

// ===== 特效 =====
let particles=[],texts=[],shake=0,shakeX=0,shakeY=0,timeScale=1,slowT=0,impactCooldown=0;
function spawnParts(x,y,n,col,spd,size,grav){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=spd*(0.35+Math.random());
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*0.2,
      life:0.45+Math.random()*0.5,max:0.95,col:col,
      s:size*(0.6+Math.random()*0.8),g:grav===undefined?900:grav});
  }
}
function spawnDust(x,y,n){
  for(let i=0;i<n;i++){
    particles.push({x:x,y:y,vx:(Math.random()-0.5)*70,vy:-Math.random()*60,
      life:0.3+Math.random()*0.3,max:0.6,col:'rgba(210,220,235,0.7)',s:1.5+Math.random()*2,g:220});
  }
}
function floatText(x,y,t,col,size){
  texts.push({x:x,y:y,t:t,col:col||'#fff',s:size||18,life:1.0,max:1.0});
}
function addShake(v){ shake=Math.min(22,shake+v); }

// ===== 關卡資料（自製佈局：地面 y=520） =====
const GY=520;
function B_(x,y,w,h,m,a){return {t:'b',x:x,y:y,w:w,h:h,m:m||'wood',a:a||0};}
function P_(x,y,w,h){return {t:'p',x:x,y:y,w:w,h:h};}
function C_(x,y){return {t:'c',x:x,y:y};}
const LEVELS=[
 {balls:4,tip:'瞄準支撐柱，塔倒了貓也就醒了',obj:[
   B_(250,485,14,70),B_(310,485,14,70),B_(280,441,100,14),C_(280,421)]},

function loadSave(){
  try{
    best=parseInt(localStorage.getItem('catTower_best')||'0',10)||0;
    farLevel=parseInt(localStorage.getItem('catTower_far')||'1',10)||1;
    const s=localStorage.getItem('catTower_stars');
    bestStars=s?JSON.parse(s):[];
    if(!Array.isArray(bestStars)) bestStars=[];
  }catch(e){best=0;farLevel=1;bestStars=[];}
  while(bestStars.length<MAXLV) bestStars.push(0);
}
function saveAll(){
  try{
    localStorage.setItem('catTower_best',String(best));
    localStorage.setItem('catTower_far',String(farLevel));
    localStorage.setItem('catTower_stars',JSON.stringify(bestStars));
  }catch(e){}
}
function totalStars(){let t=0;for(let i=0;i<bestStars.length;i++)t+=bestStars[i]||0;return t;}

function buildLevel(n){
  bodies=[];warmPrev.clear();warmCur.clear();
  particles=[];texts=[];ball=null;detonated=false;shake=0;
  // 地面與左右看不見的牆（避免物件掉出畫面變成無解）
  const g=addBox(200,GY+120,900,240,'stone',0,true); g.kind='ground'; g.fric=0.7;
  const wl=addBox(-40,300,80,900,'stone',0,true); wl.kind='wall'; wl.rest=0;
  const wr=addBox(440,300,80,900,'stone',0,true); wr.kind='wall'; wr.rest=0;
  const L=LEVELS[n];
  catsTotal=0;
  for(let i=0;i<L.obj.length;i++){
    const o=L.obj[i];
    if(o.t==='b') addBox(o.x,o.y,o.w,o.h,o.m,o.a,false);
    else if(o.t==='p'){const p=addBox(o.x,o.y,o.w,o.h,'stone',0,true);p.kind='plat';}
    else{
      const c=addCircle(o.x,o.y,13,'cat',0.0015,0.5,0.05,10);
      c.kind='cat';catsTotal++;
    }
  }
  ballsLeft=L.balls;
  aimAng=-0.85;shotTimer=0;resolveT=0;levelScore=0;combo=0;comboT=0;
  flyHintT=0;
}
function catsAlive(){let n=0;for(let i=0;i<bodies.length;i++)if(bodies[i].kind==='cat'&&!bodies[i].dead)n++;return n;}

function startRun(){
  initAudio();
  level=0;score=0;hearts=3;runStars=0;newRecord=false;winRun=false;
  buildLevel(0);state='play';

}
function fire(){
  if(state!=='play'||ball||ballsLeft<=0) return;
  const dx=Math.cos(aimAng),dy=Math.sin(aimAng);
  ball=addCircle(LX+dx*24,LY+dy*24,BALL_R,'ball',0.0026,0.3,0.2,1e9);
  ball.kind='ball';ball.vx=dx*V0;ball.vy=dy*V0;ball.av=(Math.random()-0.5)*6;
  ballsLeft--;detonated=false;shotTimer=0;flyHintT=0;
  SFX.launch();addShake(3);
  spawnParts(ball.x,ball.y,8,'rgba(255,215,140,0.9)',120,2.4,300);
}
function detonate(){
  if(!ball||ball.dead||detonated) return;
  detonated=true;
  explode(ball.x,ball.y,84,760,9,'#ffd36e');
  ball.dead=true;ball=null;
}
function explode(x,y,R,force,dmg,col){
  SFX.boom();addShake(14);
  spawnParts(x,y,26,col||'#ffb347',300,4,500);
  spawnParts(x,y,14,'rgba(255,255,255,0.85)',180,3,300);
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i];
    if(b.static||b.dead) continue;
    const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy);
    if(d>R) continue;
    const f=(1-d/R);
    const ux=d<1e-6?0:dx/d, uy=d<1e-6?-1:dy/d;
    b.sleeping=false;b.sleepT=0;
    b.vx+=ux*force*f*b.invM*0.9;
    b.vy+=uy*force*f*b.invM*0.9-f*60;
    b.av+=(Math.random()-0.5)*8*f;
    b.dmgAcc+=dmg*f;
  }
}
// 死亡結算：貓被敲醒、磚塊碎裂、炸彈磚連鎖
function processDamage(dt){
  const booms=[];
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i];
    if(b.dead||b.static||b.kind==='ball') continue;
    if(b.flash>0) b.flash=Math.max(0,b.flash-dt*3);
    if(b.dmgAcc>0){
      if(b.hp<1e8){ b.hp-=b.dmgAcc; b.flash=1; }
      b.dmgAcc=0;
      if(b.hp<=0&&!b.dead){
        b.dead=true;
        if(b.kind==='cat'){
          combo++;comboT=1.6;
          const gain=120*Math.min(8,combo);
          levelScore+=gain;score+=gain;
          SFX.cat(combo-1);addShake(7);
          spawnParts(b.x,b.y,20,'#6fe08a',230,3.6,420);
          spawnParts(b.x,b.y,10,'#fff3b0',160,2.6,300);
          floatText(b.x,b.y-16,'+'+gain,'#ffe680',20);
          if(combo>1) floatText(b.x,b.y-38,combo+' 連鎖！','#8fe8ff',17);
          if(catsAlive()===0){ slowT=0.42; }
        }else if(b.mat==='bomb'){
          booms.push([b.x,b.y]);
        }else if(b.mat==='ice'){
          SFX.glass();spawnParts(b.x,b.y,16,'#bdf0ff',210,3,420);
          levelScore+=15;score+=15;
        }else{
          SFX.crack();spawnParts(b.x,b.y,14,'#c08a45',180,3.2,480);
          levelScore+=15;score+=15;
        }
      }
    }
  }
  for(let i=0;i<booms.length;i++) explode(booms[i][0],booms[i][1],96,880,11,'#ff9a4d');
  if(booms.length) bodies=bodies.filter(b=>!b.dead||b.kind==='ball');
  bodies=bodies.filter(b=>!b.dead);
  if(ball&&ball.dead) ball=null;
}

function levelClear(){
  starGot=ballsLeft>=2?3:(ballsLeft===1?2:1);
  const bonus=ballsLeft*300+[0,100,300,600][starGot]+(level+1)*40;
  levelScore+=bonus;score+=bonus;
  if(starGot>(bestStars[level]||0)) bestStars[level]=starGot;
  runStars+=starGot;
  if(starGot===3&&hearts<5){hearts++;}
  if(level+2>farLevel) farLevel=Math.min(MAXLV,level+2);
  saveAll();
  state='clear';clearT=0;starAnim=0;
  SFX.clear();addShake(8);
  for(let i=0;i<26;i++)
    particles.push({x:Math.random()*W,y:-10-Math.random()*60,vx:(Math.random()-0.5)*60,
      vy:60+Math.random()*90,life:2.4,max:2.4,
      col:['#ffd166','#8fe8ff','#6fe08a','#ff8fb1'][i%4],s:3.5,g:60});
}
function levelFail(){
  hearts--;
  state='fail';failT=0;
  SFX.fail();
  if(hearts<=0){ setTimeout(()=>{},0); }
}
function endRun(win){
  winRun=win;
  if(win){ score+=800; }
  newRecord=score>best;
  if(newRecord){ best=score; SFX.record(); }
  saveAll();
  state='over';overT=0;
  if(!newRecord) SFX.fail();
  // 匿名數據回報（站台注入）
  if(window.SC) SC.over(score);
}

// ===== 更新 =====
function update(dt){
  if(impactCooldown>0) impactCooldown-=dt;
  if(slowT>0){ slowT-=dt; timeScale=0.28; } else timeScale=1;
  if(shake>0){ shake=Math.max(0,shake-dt*38);
    shakeX=(Math.random()-0.5)*shake; shakeY=(Math.random()-0.5)*shake; }
  else {shakeX=0;shakeY=0;}
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt; if(p.life<=0){particles.splice(i,1);continue;}
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.99;
  }
  for(let i=texts.length-1;i>=0;i--){
    const t=texts[i]; t.life-=dt; t.y-=26*dt;
    if(t.life<=0) texts.splice(i,1);
  }
  if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }

  if(state==='title'){ titleT+=dt; return; }
  if(state==='clear'){ clearT+=dt; starAnim+=dt;
    if(starAnim>0.35&&starAnim-dt<=0.35) SFX.star(0);
    if(starAnim>0.6&&starAnim-dt<=0.6&&starGot>1) SFX.star(1);
    if(starAnim>0.85&&starAnim-dt<=0.85&&starGot>2) SFX.star(2);
    if(clearT>2.8) nextLevel();
    return; }
  if(state==='fail'){ failT+=dt; if(failT>1.6&&hearts<=0) endRun(false); return; }
  if(state==='over'){ overT+=dt; return; }

  // 遊戲中
  physStep(dt);
  processDamage(dt);
  if(ball){
    shotTimer+=dt; flyHintT+=dt;
    if(ball.y>700||ball.x<-70||ball.x>470){ ball.dead=true;ball=null; }
    else{
      const sp=Math.hypot(ball.vx,ball.vy);
      if(sp<26){ ball.stopT=(ball.stopT||0)+dt; if(ball.stopT>0.45){ 
        spawnParts(ball.x,ball.y,8,'rgba(255,150,190,0.8)',90,2.2,400);
        ball.dead=true;ball=null; } }
      else ball.stopT=0;
      if(shotTimer>9){ if(ball){ball.dead=true;ball=null;} }
    }
    if(ball&&!ball.dead){
      if(Math.random()<0.5)
        particles.push({x:ball.x,y:ball.y,vx:0,vy:0,life:0.28,max:0.28,
          col:'rgba(255,160,200,0.55)',s:4,g:0});
    }
  }
  if(!ball){
    if(worldSettled()) resolveT+=dt; else resolveT=0;
    if(resolveT>0.45){
      resolveT=0;
      if(catsAlive()===0) levelClear();
      else if(ballsLeft<=0) levelFail();
    }
  }
}
function nextLevel(){
  level++;
  if(level>=MAXLV){ endRun(true); return; }
  buildLevel(level); state='play';
}
function retryLevel(){
  if(hearts<=0){ endRun(false); return; }
  buildLevel(level); state='play'; SFX.ui();
}

// ===== 繪圖 =====
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

for(let i=0;i<46;i++) STARS.push({x:Math.random()*W,y:Math.random()*430,r:Math.random()*1.3+0.4,p:Math.random()*6.28});

function drawBlock(b){
  const m=MAT[b.mat]||MAT.wood;
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);
  const w=b.hw*2,h=b.hh*2;
  if(b.mat==='bomb'){
    const pulse=0.5+0.5*Math.sin(animT*7);
    ctx.fillStyle='#25293a';rr(-b.hw,-b.hh,w,h,4);ctx.fill();
    ctx.strokeStyle='rgba(255,90,70,'+(0.4+0.6*pulse)+')';ctx.lineWidth=2.5;
    rr(-b.hw+1.5,-b.hh+1.5,w-3,h-3,4);ctx.stroke();
    ctx.fillStyle='rgba(255,'+Math.floor(120+90*pulse)+',60,1)';
    ctx.beginPath();ctx.arc(0,0,4+pulse*1.6,0,6.283);ctx.fill();
  }else if(b.mat==='ice'){
    ctx.fillStyle='rgba(150,225,255,0.55)';rr(-b.hw,-b.hh,w,h,3);ctx.fill();
    ctx.strokeStyle='rgba(230,250,255,0.85)';ctx.lineWidth=1.6;
    rr(-b.hw+1,-b.hh+1,w-2,h-2,3);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-b.hw+3,b.hh-3);ctx.lineTo(b.hw-4,-b.hh+3);ctx.stroke();
  }else{
    const grd=ctx.createLinearGradient(0,-b.hh,0,b.hh);
    grd.addColorStop(0,m.c1);grd.addColorStop(1,m.c2);
    ctx.fillStyle=grd;rr(-b.hw,-b.hh,w,h,3);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1.4;
    rr(-b.hw,-b.hh,w,h,3);ctx.stroke();
    if(b.mat==='wood'){
      ctx.strokeStyle='rgba(0,0,0,0.16)';ctx.lineWidth=1;
      const step=Math.max(9,Math.min(w,h)/2);
      for(let i=-b.hw+step;i<b.hw-2;i+=step){
        ctx.beginPath();ctx.moveTo(i,-b.hh+2);ctx.lineTo(i,b.hh-2);ctx.stroke();
      }
    }else{
      ctx.fillStyle='rgba(255,255,255,0.14)';
      ctx.beginPath();ctx.arc(-b.hw*0.4,-b.hh*0.3,Math.min(3,b.hh*0.4),0,6.283);ctx.fill();
      ctx.beginPath();ctx.arc(b.hw*0.35,b.hh*0.25,Math.min(2.4,b.hh*0.35),0,6.283);ctx.fill();
    }
  }
  // 受損裂痕與閃白
  if(b.hp<1e8&&b.hp<b.maxhp){
    const dmg=1-b.hp/b.maxhp;
    ctx.strokeStyle='rgba(20,10,0,'+(0.25+0.5*dmg)+')';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(-b.hw*0.5,-b.hh*0.6);ctx.lineTo(-b.hw*0.1,0);
    ctx.lineTo(-b.hw*0.35,b.hh*0.5);ctx.stroke();
  }
  if(b.flash>0){
    ctx.fillStyle='rgba(255,255,255,'+(b.flash*0.55)+')';
    rr(-b.hw,-b.hh,w,h,3);ctx.fill();
  }
  ctx.restore();
}
// 史萊姆貓（綠色果凍＋貓耳）
function drawCat(c){
  const r=c.r, hurt=1-c.hp/c.maxhp;
  const wob=Math.sin(animT*3+c.wob)*0.06;
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a*0.35);
  ctx.scale(1+wob,1-wob);
  // 影子光暈
  ctx.fillStyle='rgba(110,240,150,0.18)';
  ctx.beginPath();ctx.arc(0,0,r+4,0,6.283);ctx.fill();
  // 耳朵
  ctx.fillStyle='#3fae5c';
  ctx.beginPath();ctx.moveTo(-r*0.75,-r*0.55);ctx.lineTo(-r*0.5,-r*1.35);ctx.lineTo(-r*0.1,-r*0.78);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(r*0.75,-r*0.55);ctx.lineTo(r*0.5,-r*1.35);ctx.lineTo(r*0.1,-r*0.78);ctx.closePath();ctx.fill();

function drawStarShape(x,y,r,fill,stroke){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rr2=i%2===0?r:r*0.46, a=-Math.PI/2+i*Math.PI/5;
    const px=x+Math.cos(a)*rr2, py=y+Math.sin(a)*rr2;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.2;ctx.stroke();}
}

function drawWorld(){
  for(let i=0;i<bodies.length;i++){
    const b=bodies[i];
    if(b.dead) continue;
    if(b.kind==='ground'||b.kind==='wall') continue;
    if(b.kind==='plat'){
      ctx.save();ctx.translate(b.x,b.y);
      ctx.fillStyle='#4a5f7e';rr(-b.hw,-b.hh,b.hw*2,b.hh*2,4);ctx.fill();
      ctx.strokeStyle='rgba(160,200,255,0.5)';ctx.lineWidth=1.4;
      rr(-b.hw,-b.hh,b.hw*2,b.hh*2,4);ctx.stroke();
      ctx.restore();continue;
    }
    if(b.kind==='cat') drawCat(b);
    else if(b.kind==='ball') drawYarn(b.x,b.y,b.a,b.r);
    else drawBlock(b);
  }
}
function drawParticles(){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    const a=Math.max(0,p.life/p.max);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(let i=0;i<texts.length;i++){
    const t=texts[i];
    ctx.globalAlpha=Math.max(0,Math.min(1,t.life/t.max*1.4));
    ctx.fillStyle=t.col;ctx.font='bold '+t.s+'px system-ui,sans-serif';
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=3;
    ctx.strokeText(t.t,t.x,t.y);ctx.fillText(t.t,t.x,t.y);
  }
  ctx.globalAlpha=1;
}

function render(){
  ctx.setTransform(VS,0,0,VS,0,0);
  ctx.clearRect(0,0,W,H);
  if(state==='title'){ drawTitle(); drawParticles(); return; }
  ctx.save();ctx.translate(shakeX,shakeY);
  drawBG();
  drawWorld();
  drawLauncher();
  if(state==='play') drawAim();
  drawParticles();
  ctx.restore();
  drawHUD();
  if(state==='clear') drawClear();
  else if(state==='fail') drawFail();
  else if(state==='over') drawOver();
}

// ===== 輸入 =====
function setAimFromPoint(p){
  const dx=p.x-LX, dy=p.y-LY;
  if(Math.hypot(dx,dy)<12) return;
  let a=Math.atan2(dy,dx);
  // 限制在往上發射的區間
  if(a>0) a=(dx>0)?-0.12:-Math.PI+0.12;
  a=Math.max(-Math.PI+0.1,Math.min(-0.1,a));
  if(a<-Math.PI/2-0.9) a=-Math.PI/2-0.9;
  aimAng=a;
}
function onDown(p){
  initAudio();
  if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(e){} }
  if(state==='title'){ startRun(); return; }
  if(state==='clear'){ if(clearT>0.5) nextLevel(); return; }
  if(state==='fail'){ if(failT>0.4){ if(hearts>0) retryLevel(); else endRun(false); } return; }
  if(state==='over'){ if(overT>0.6) startRun(); return; }
  if(state==='play'){
    if(ball&&!ball.dead){ detonate(); return; }
    aiming=true; setAimFromPoint(p);
  }
}
function onMove(p){
  if(state==='play'&&aiming&&!ball){ setAimFromPoint(p); }
}
function onUp(){
  if(state==='play'&&aiming){ aiming=false; fire(); }
  aiming=false;
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  onDown(toLogic(e.clientX,e.clientY));
});
cv.addEventListener('pointermove',function(e){
  e.preventDefault(); onMove(toLogic(e.clientX,e.clientY));
});
cv.addEventListener('pointerup',function(e){ e.preventDefault(); onUp(); });
cv.addEventListener('pointercancel',function(e){ e.preventDefault(); aiming=false; clearKeys(); });
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
window.addEventListener('blur',function(){ aiming=false; clearKeys(); });
document.addEventListener('visibilitychange',function(){ if(document.hidden){aiming=false;clearKeys();} });

const keys={};
function clearKeys(){ for(const k in keys) keys[k]=false; }
window.addEventListener('keydown',function(e){
  const k=e.key;
  if(k===' '||k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight') e.preventDefault();
  if(keys[k]) return;
  keys[k]=true;
  if(k===' '||k==='Enter'){
    initAudio();
    if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(err){} }
    if(state==='title') startRun();
    else if(state==='clear'){ if(clearT>0.5) nextLevel(); }
    else if(state==='fail'){ if(failT>0.4){ if(hearts>0) retryLevel(); else endRun(false); } }
    else if(state==='over'){ if(overT>0.6) startRun(); }
    else if(state==='play'){ if(ball&&!ball.dead) detonate(); else fire(); }
  }
});
window.addEventListener('keyup',function(e){ keys[e.key]=false; });
function keyAim(dt){
  if(state!=='play'||ball) return;
  let d=0;
  if(keys['ArrowLeft']) d-=1;
  if(keys['ArrowRight']) d+=1;
  if(keys['ArrowUp']) d-=1;
  if(keys['ArrowDown']) d+=1;
  if(d!==0){
    aimAng=Math.max(-Math.PI/2-0.9,Math.min(-0.1,aimAng+d*1.35*dt));
  }
}

// ===== 主迴圈（固定時間步長，不假設 60fps） =====
let acc=0,last=performance.now();
function frame(now){
  let ft=(now-last)/1000; last=now;
  if(ft>0.25) ft=0.25; if(ft<0) ft=0;
  animT+=ft;
  acc+=ft*timeScale;
  let steps=0;
  while(acc>=FDT&&steps<7){ keyAim(FDT); update(FDT); acc-=FDT; steps++; }
  if(steps>=7) acc=0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
