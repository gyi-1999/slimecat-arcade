<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>喵探線索鋪</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#080b14;overflow:hidden;
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;border-radius:14px;box-shadow:0 12px 44px rgba(0,0,0,.65)}
#back{position:fixed;left:8px;top:6px;z-index:5;color:#9fe0c2;font-size:13px;text-decoration:none;
  background:rgba(0,0,0,.5);padding:5px 10px;border-radius:12px}
</style>
</head>
<body>
<a id="back" href="../../index.html">← 回遊戲區</a>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
'use strict';
/* ===== 喵探線索鋪：放置式三連合併 + 線索收集 =====
   核心迴圈：放下線索 → 三個同款自動合併升階 → 連鎖爆分 → 解鎖劇情線索碎片
   回合制、無時間逼迫，每一次放置都是一個決策（決策密度高）           */

/* ---------- 基本常數 ---------- */
var W=400,H=600,COLS=5,ROWS=6,N=30,CELL=68,GAP=5,BX=20,BY=112;
var BW=COLS*(CELL+GAP)-GAP, BH=ROWS*(CELL+GAP)-GAP;   // 360 x 433
var FONT='"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif';
var EFONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

/* 八階線索道具（史萊姆貓辦案雜貨） */
var TIERS=[
 {e:'🧶',n:'毛線團',c:'#3f5f96'},
 {e:'🐟',n:'魚乾屑',c:'#2f8a86'},
 {e:'🐾',n:'爪印',c:'#4f9c46'},
 {e:'🔍',n:'放大鏡',c:'#a8862c'},
 {e:'📜',n:'密報',c:'#a95f2c'},
 {e:'🔑',n:'銅鑰匙',c:'#9d4230'},
 {e:'🎩',n:'偵探帽',c:'#71359a'},
 {e:'🏆',n:'破案獎章',c:'#c39c22'}
];
var MAXT=TIERS.length-1;

/* 八條線索碎片（好奇心缺口，最後一條是真相） */
var CLUES=[
 '魚乾罐子昨晚少了三塊。門明明是鎖著的，喵。',
 '牆邊一排濕爪印，尺寸偏小，走得很急。',
 '毛線團被拆成一團亂——兇手手很閒。',
 '窗台留下一撮橘毛，不是本店任何員工的顏色。',
 '隔壁阿虎說牠整晚在睡，可是眼神一直在飄。',
 '倉庫鑰匙還掛在原位，所以是內部人士下的手。',
 '碎屑一路灑向店後方那個綠綠、軟軟的窩……',
 '真相：是我自己半夜夢遊吃掉的。全員解散，結案喵。'
];
var LINES=['合起來了喵。','這條線索有味道。','筆記本先記一下。','證物袋快不夠用了。',
 '等等，這爪印…','案情越來越香了。','我好像想到什麼了。'];
var TAUNT=['再一局就翻案了喵。','兇手還在笑你喵。','差一步而已，重來！','這次一定湊到獎章。'];

/* ---------- Canvas 與高解析度縮放 ---------- */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var vscale=1,dpr=1;
function resize(){
  var vw=window.innerWidth||W, vh=window.innerHeight||H;
  vscale=Math.min(vw/W, vh/H);
  if(!(vscale>0)) vscale=1;
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=(W*vscale)+'px'; cv.style.height=(H*vscale)+'px';
  cv.width=Math.round(W*vscale*dpr); cv.height=Math.round(H*vscale*dpr);
  ctx.setTransform(vscale*dpr,0,0,vscale*dpr,0,0);   // 邏輯座標維持 400x600
  ctx.textBaseline='middle';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
resize();

/* ---------- WebAudio 合成音效 ---------- */
var AC=null;
function actx(){
  if(AC===null){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } }
  return AC||null;
}
function resumeAudio(){ var a=actx(); if(a&&a.state==='suspended'){ try{a.resume();}catch(e){} } }
function beep(f,d,type,vol,delay,f2){
  var a=actx(); if(!a) return;
  try{
    var t0=a.currentTime+(delay||0);
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+d);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.08,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+d+0.05);
  }catch(e){}
}
function sc(s){ return Math.pow(2,s/12); }
var sfx={
 place:function(){ beep(320,0.07,'triangle',0.07,0,220); },
 merge:function(t,c){ var f=300*sc(t*2+(c-1)*3); beep(f,0.15,'sine',0.10); beep(f*1.5,0.10,'triangle',0.05,0.03); },
 rat:function(){ beep(950,0.07,'sawtooth',0.05,0,1500); beep(1200,0.05,'sawtooth',0.04,0.07,900); },
 ratClear:function(){ for(var i=0;i<3;i++) beep(440*sc(i*2),0.12,'square',0.05,i*0.05); },
 order:function(){ var s=[0,4,7,12]; for(var i=0;i<4;i++) beep(392*sc(s[i]),0.20,'sine',0.09,i*0.08); },
 clue:function(){ beep(880,0.26,'sine',0.07); beep(1320,0.30,'triangle',0.04,0.06); },
 gift:function(){ var s=[0,5,9,14]; for(var i=0;i<4;i++) beep(523*sc(s[i]),0.16,'triangle',0.07,i*0.05); },
 broom:function(){ beep(1600,0.08,'square',0.045,0,600); beep(900,0.09,'square',0.03,0.05,300); },
 bad:function(){ beep(150,0.10,'square',0.05,0,110); },
 warn:function(){ beep(230,0.30,'sawtooth',0.05,0,175); },
 over:function(){ var s=[0,-3,-7,-12]; for(var i=0;i<4;i++) beep(330*sc(s[i]),0.36,'triangle',0.09,i*0.14); },
 record:function(){ var s=[0,4,7,12,16,19]; for(var i=0;i<6;i++) beep(523*sc(s[i]),0.30,'sine',0.10,i*0.09); },
 jackpot:function(){ var s=[0,7,12,19,24]; for(var i=0;i<5;i++) beep(392*sc(s[i]),0.42,'sine',0.11,i*0.07); },
 tick:function(){ beep(700,0.04,'square',0.04); }
};

/* ---------- localStorage（最高分／線索牆／連續來訪） ---------- */
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
var best=parseInt(lsGet('mtx_best','0'),10)||0;
var wall=parseInt(lsGet('mtx_wall','0'),10)||0;   // 線索牆：歷史最多解鎖數
var streak=1;
(function(){
  try{
    var d=new Date();
    function key(x){ return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(); }
    var today=key(d), yest=key(new Date(d.getTime()-864e5));
    var last=lsGet('mtx_last',''), st=parseInt(lsGet('mtx_streak','0'),10)||0;
    if(last===today) streak=Math.max(1,st);
    else if(last===yest) streak=st+1;
    else streak=1;
    lsSet('mtx_last',today); lsSet('mtx_streak',String(streak));
  }catch(e){ streak=1; }
})();

/* ---------- 遊戲狀態 ---------- */
var grid=new Array(N), queue=[], order=null;
var score=0,disp=0,brooms=1,clues=0,maxTier=0,turn=0,ordersDone=0;
var mode='title', ratsMove=false, junkTurn=42, warnedLow=false;
var time=0, shake=0, broomMode=false, kb=false, cur=12;
var parts=[],floats=[],ghosts=[],timers=[],cardQ=[],card=null,toast=null;
var overInfo=null, recFx=0, truth=false;

function after(t,fn){ timers.push({t:t,fn:fn}); }
function empties(){ var n=0; for(var i=0;i<N;i++) if(!grid[i]) n++; return n; }
function cxp(i){ return BX+(i%COLS)*(CELL+GAP); }
function cyp(i){ return BY+((i/COLS)|0)*(CELL+GAP); }
function nbs(i){ var x=i%COLS,y=(i/COLS)|0,r=[];
  if(x>0)r.push(i-1); if(x<COLS-1)r.push(i+1); if(y>0)r.push(i-COLS); if(y<ROWS-1)r.push(i+COLS); return r; }
function same(a,b){ if(!a||!b) return false; if(a.kind!==b.kind) return false;
  if(a.kind==='rat') return true; return a.tier===b.tier; }
function flood(i){
  var c=grid[i]; if(!c) return [];
  var seen={},st=[i],out=[]; seen[i]=1;
  while(st.length){
    var k=st.pop(); out.push(k);
    var nb=nbs(k);
    for(var j=0;j<nb.length;j++){ var q=nb[j]; if(!seen[q]&&same(grid[q],c)){ seen[q]=1; st.push(q); } }
  }
  return out;
}

/* ---------- 生成器（難度隨回合遞增） ---------- */
function genQ(){
  var t=turn;
  if(t>=12 && Math.random()<0.07) return {kind:'gift'};                                  // 神秘箱：變動比例獎勵
  if(t>=18 && Math.random()<Math.min(0.18,0.05+(t-18)*0.006)) return {kind:'rat'};       // 老鼠：佔位壓力
  var p2 = t<10?0.34 : (t<25?0.24 : (t<45?0.15:0.09));   // 後期二階變少 → 需要更多格子
  return {kind:'item',tier: Math.random()<p2?1:0};
}

/* ---------- 委託（目標梯度效應） ---------- */
function newOrder(){
  var tb=[{tier:2,need:3},{tier:3,need:2},{tier:2,need:5},{tier:3,need:3},
          {tier:4,need:1},{tier:3,need:4},{tier:4,need:2},{tier:5,need:1}];
  var d=ordersDone, o;
  if(d<tb.length) o=tb[d];
  else o={tier:3+(d%3), need:2+((d-tb.length)%3)};
  order={tier:o.tier,need:o.need,have:0};
}

/* ---------- 特效 ---------- */
function burst(x,y,col,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, s=40+Math.random()*180;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:0.5+Math.random()*0.5,m:0.5+Math.random()*0.5,c:col,r:1.5+Math.random()*3});
  }
}
function addFloat(x,y,txt,col,sz){ floats.push({x:x,y:y,t:txt,c:col,s:sz||16,l:1.1,m:1.1}); }
function addGhost(i,c,delay){ if(!c) return; ghosts.push({x:cxp(i)+(c.ox||0),y:cyp(i)+(c.oy||0),c:c,t:-(delay||0)}); }
function toastMsg(t){ toast={txt:t,l:2.0}; }
function sayLine(){ toastMsg(LINES[(Math.random()*LINES.length)|0]); }

/* ---------- 連鎖合併核心 ---------- */
function resolveFrom(i){
  var combo=0;
  for(var guard=0;guard<48;guard++){
    var c=grid[i]; if(!c) break;
    var g=flood(i); if(g.length<3) break;
    combo++;
    var delay=(combo-1)*0.11, k;
    var px=cxp(i)+CELL/2, py=cyp(i)+CELL/2;
    for(k=0;k<g.length;k++){ if(g[k]!==i){ addGhost(g[k],grid[g[k]],delay); grid[g[k]]=null; } }

    if(c.kind==='rat'){                        // 三隻老鼠 → 抓走，清出空間
      addGhost(i,c,delay); grid[i]=null;
      (function(gain,x,y){ after(delay,function(){
        score+=gain; burst(x,y,'#f2d16b',20); addFloat(x,y,'🧀 抓到了 +'+gain,'#ffe9a8',18);
        sfx.ratClear(); shake=Math.max(shake,5);
      }); })(90*combo,px,py);
      break;
    }
    var nt=c.tier+1;
    if(nt>MAXT){                               // 三個獎章 → 結案大賞
      addGhost(i,c,delay); grid[i]=null;
      (function(gain,x,y){ after(delay,function(){
        score+=gain; burst(x,y,'#ffd94a',48); addFloat(x,y,'結案大賞 +'+gain,'#ffe9a8',20);
        sfx.jackpot(); shake=12; recFx=Math.max(recFx,1.4);
      }); })(3000*combo,px,py);
      break;
    }
    grid[i]={kind:'item',tier:nt,born:time+delay,ox:0,oy:0};
    (function(nt,gain,cb,x,y){ after(delay,function(){
      score+=gain;
      burst(x,y,TIERS[nt].c,10+nt*4);
      addFloat(x,y-8,'+'+gain,'#eafff0',cb>1?20:17);
      if(cb>1) addFloat(x,y-32,'連鎖 x'+cb+'！','#ffd479',19);
      sfx.merge(nt,cb); shake=Math.max(shake,2+nt*0.9);
      if(order&&order.tier===nt){ order.have++; if(order.have>=order.need) completeOrder(); }
      if(nt>maxTier){ maxTier=nt; if(nt>=3) unlockClue(); }
      if(Math.random()<0.20) sayLine();
    }); })(nt, Math.round(12*Math.pow(2.15,nt))*combo, combo, px, py);
  }
}

function completeOrder(){
  var bonus=180+ordersDone*90;
  ordersDone++; score+=bonus;
  addFloat(200,300,'委託完成！+'+bonus,'#8ef0b0',24);
  burst(200,86,'#8ef0b0',26);
  sfx.order(); shake=Math.max(shake,7);
  if(brooms<3 && ordersDone%2===1){ brooms++; addFloat(324,536,'🧹 +1','#ffe9a8',18); }
  unlockClue(); newOrder();
}

function unlockClue(){
  if(clues>=CLUES.length) return;
  clues++;
  if(clues>wall){ wall=clues; lsSet('mtx_wall',String(wall)); }
  if(clues===CLUES.length){ truth=true; score+=2500; recFx=Math.max(recFx,2.0); }
  cardQ.push(clues); sfx.clue();
}

/* ---------- 放置 / 掃帚 ---------- */
function place(i){
  if(mode!=='play'||card) return;
  if(broomMode){
    if(grid[i]){
      addGhost(i,grid[i],0); grid[i]=null; brooms--; broomMode=false;
      sfx.broom(); burst(cxp(i)+CELL/2,cyp(i)+CELL/2,'#bcd9ff',16);
      addFloat(cxp(i)+CELL/2,cyp(i)+CELL/2,'清掉了','#bcd9ff',16);
    }else{ broomMode=false; sfx.bad(); }
    return;                                   // 掃帚不消耗回合
  }
  if(grid[i]){
    sfx.bad(); shake=Math.max(shake,3);
    addFloat(cxp(i)+CELL/2,cyp(i)+CELL/2,'有東西了','#ff9d9d',14);
    return;
  }
  var q=queue.shift(); queue.push(genQ());
  if(q.kind==='gift') openGift(i);
  else if(q.kind==='rat'){
    grid[i]={kind:'rat',born:time,ox:0,oy:0}; sfx.rat();
    burst(cxp(i)+CELL/2,cyp(i)+CELL/2,'#8a8fa3',8);
  }else{
    grid[i]={kind:'item',tier:q.tier,born:time,ox:0,oy:0}; sfx.place();
    burst(cxp(i)+CELL/2,cyp(i)+CELL/2,TIERS[q.tier].c,6);
  }
  resolveFrom(i);
  endTurn();
}

function openGift(i){
  var r=Math.random(), px=cxp(i)+CELL/2, py=cyp(i)+CELL/2;
  sfx.gift(); burst(px,py,'#ffd479',30);
  if(r<0.20 && brooms<3){ brooms++; addFloat(px,py,'神秘箱：🧹 +1','#ffe9a8',17); return; }
  if(r<0.28){
    var n=0;
    for(var k=0;k<N;k++) if(grid[k]&&grid[k].kind==='rat'){ addGhost(k,grid[k],0.02*n); grid[k]=null; n++; }
    score+=120*n+60;
    addFloat(px,py,n?('神秘箱：趕走 '+n+' 隻老鼠'):'神秘箱：+60','#bcd9ff',17);
    return;
  }
  var t = r<0.62?2:(r<0.88?3:4);
  grid[i]={kind:'item',tier:t,born:time,ox:0,oy:0};
  addFloat(px,py-30,'神秘箱：'+TIERS[t].e,'#ffe9a8',17);
}

/* ---------- 回合結算（第 3 分鐘的新壓力源都在這） ---------- */
function endTurn(){
  turn++;
  if(!ratsMove && turn>=30){ ratsMove=true; toastMsg('🐭 老鼠開始亂跑了！'); }      // 壓力源一
  if(ratsMove && turn%3===0) after(0.34,moveRats);
  if(turn===junkTurn){                                                            // 壓力源二：有人亂丟
    after(0.42,dropJunk);
    junkTurn += Math.max(6,10-Math.floor((turn-42)/20));
  }
  var e=empties();
  if(e<=4 && !warnedLow){ warnedLow=true; sfx.warn(); }
  if(e>6) warnedLow=false;
  after(0.5,checkOver);
}
function moveRats(){
  if(mode!=='play') return;
  var list=[];
  for(var i=0;i<N;i++) if(grid[i]&&grid[i].kind==='rat') list.push(i);
  for(var a=0;a<list.length;a++){
    var i2=list[a], nb=nbs(i2).filter(function(k){ return !grid[k]; });
    if(!nb.length) continue;
    var k2=nb[(Math.random()*nb.length)|0], r=grid[i2];
    grid[k2]=r; grid[i2]=null;
    r.ox=(i2%COLS-k2%COLS)*(CELL+GAP);
    r.oy=(((i2/COLS)|0)-((k2/COLS)|0))*(CELL+GAP);
    r.born=time-1;
  }
  for(var j=0;j<N;j++) if(grid[j]&&grid[j].kind==='rat'&&flood(j).length>=3){ resolveFrom(j); break; }
}
function dropJunk(){
  if(mode!=='play') return;
  var em=[]; for(var i=0;i<N;i++) if(!grid[i]) em.push(i);
  if(!em.length) return;
  var k=em[(Math.random()*em.length)|0];
  grid[k]={kind:'item',tier:0,born:time,ox:0,oy:0};
  sfx.bad(); shake=Math.max(shake,6);
  addFloat(cxp(k)+CELL/2,cyp(k)+CELL/2,'有人亂丟！','#ffb3b3',17);
  resolveFrom(k);
}
function checkOver(){
  if(mode!=='play') return;
  if(empties()===0 && brooms<=0) gameOver();
}

/* ---------- 結束 / 開始 ---------- */
function gameOver(){
  for(var i=0;i<timers.length;i++){ try{ timers[i].fn(); }catch(e){} }   // 結算前把待處理分數補完
  timers=[];
  mode='over'; broomMode=false; card=null; cardQ=[];
  var fin=Math.round(score), prev=best;
  if(fin>prev){ best=fin; lsSet('mtx_best',String(best)); recFx=2.2; sfx.record(); }
  else sfx.over();
  overInfo={score:fin,rec:fin>prev,diff:Math.max(1,prev-fin+1),clues:clues,maxTier:maxTier,turn:turn,
            taunt:TAUNT[(Math.random()*TAUNT.length)|0],t:0};
  if(window.SC) SC.over(fin);
}
function start(){
  grid=new Array(N);
  for(var i=0;i<N;i++) grid[i]=null;
  score=0; disp=0; brooms=1; clues=0; maxTier=0; turn=0; ordersDone=0;
  mode='play'; ratsMove=false; junkTurn=42; warnedLow=false; truth=false;
  parts=[]; floats=[]; ghosts=[]; timers=[]; cardQ=[]; card=null; toast=null;
  broomMode=false; shake=0; recFx=0; overInfo=null; cur=12;
  queue=[genQ(),genQ()]; newOrder();
  // 開局先鋪兩對「差一個就合併」的線索：前 15 秒保證有爽感、不可能死
  grid[6]={kind:'item',tier:0,born:0,ox:0,oy:0};
  grid[8]={kind:'item',tier:0,born:0,ox:0,oy:0};
  grid[12]={kind:'item',tier:1,born:0,ox:0,oy:0};
  grid[16]={kind:'item',tier:1,born:0,ox:0,oy:0};
  toastMsg('點亮的格子放下去就會合併喵！');
  sfx.tick();
}

/* ---------- 輸入 ---------- */
function cellAt(x,y){
  if(x<BX-6||x>BX+BW+6) return -1;
  if(y<BY-6||y>BY+BH+6) return -1;
  var c=Math.floor((x-BX)/(CELL+GAP)), r=Math.floor((y-BY)/(CELL+GAP));
  c=Math.max(0,Math.min(COLS-1,c)); r=Math.max(0,Math.min(ROWS-1,r));
  return r*COLS+c;
}
function clearInput(){ broomMode=false; }
cv.addEventListener('pointerdown',function(e){
  if(e.preventDefault) e.preventDefault();
  resumeAudio();
  var r=cv.getBoundingClientRect();
  if(!r.width||!r.height) return;

    if(brooms>0){ broomMode=!broomMode; sfx.tick(); } else sfx.bad();

/* ---------- 更新 ---------- */
function update(dt){
  time+=dt;
  var i;
  for(i=timers.length-1;i>=0;i--){
    timers[i].t-=dt;
    if(timers[i].t<=0){ var f=timers[i].fn; timers.splice(i,1); try{ f(); }catch(e){} }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.l-=dt; if(p.l<=0){ parts.splice(i,1); continue; }
    p.vy+=340*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.98;
  }
  for(i=floats.length-1;i>=0;i--){
    var fl=floats[i]; fl.l-=dt; fl.y-=34*dt; if(fl.l<=0) floats.splice(i,1);
  }
  for(i=ghosts.length-1;i>=0;i--){
    var g=ghosts[i]; g.t+=dt; if(g.t>0.24) ghosts.splice(i,1);
  }
  for(i=0;i<N;i++){
    var c=grid[i]; if(!c) continue;
    if(c.ox) c.ox+= -c.ox*Math.min(1,dt*13);
    if(c.oy) c.oy+= -c.oy*Math.min(1,dt*13);
  }
  shake+= -shake*Math.min(1,dt*9); if(shake<0.15) shake=0;
  disp+= (score-disp)*Math.min(1,dt*9);
  if(Math.abs(score-disp)<0.6) disp=score;
  if(recFx>0){
    recFx-=dt;
    if(Math.random()<0.5) burst(30+Math.random()*340,120+Math.random()*380,
      ['#ffd94a','#8ef0b0','#9fd0ff'][(Math.random()*3)|0],3);
  }
  if(!card&&cardQ.length) card={n:cardQ.shift(),t:0};
  if(card){ card.t+=dt; if(card.t>3.0) card=null; }
  if(toast){ toast.l-=dt; if(toast.l<=0) toast=null; }
  if(overInfo) overInfo.t+=dt;
}

/* ---------- 繪圖工具 ---------- */
function F(s,w){ ctx.font=(w?w+' ':'')+s+'px '+FONT; }
function EF(s){ ctx.font=s+'px '+EFONT; }
function rr(x,y,w,h,r){
  if(r>w/2)r=w/2; if(r>h/2)r=h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function txt(t,x,y,col,size,align,weight){
  F(size,weight); ctx.fillStyle=col; ctx.textAlign=align||'left'; ctx.fillText(t,x,y);
}
function emo(e,x,y,size){
  EF(size); ctx.textAlign='center'; ctx.fillText(e,x,y);
}
/* 史萊姆貓（綠史萊姆＋貓耳） */
function drawSlime(x,y,r){
  ctx.save(); ctx.translate(x,y);
  var br=1+0.05*Math.sin(time*2.2);
  ctx.scale(1/br,br);
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0,r*0.95,r*0.85,r*0.2,0,0,6.3); ctx.fill();
  var g=ctx.createRadialGradient(-r*0.3,-r*0.45,r*0.1,0,0,r*1.25);
  g.addColorStop(0,'#b6f59a'); g.addColorStop(1,'#3d9b4e');
  ctx.fillStyle=g;
  ctx.beginPath();                                  // 貓耳
  ctx.moveTo(-r*0.78,-r*0.42); ctx.lineTo(-r*0.62,-r*1.15); ctx.lineTo(-r*0.14,-r*0.72); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r*0.78,-r*0.42); ctx.lineTo(r*0.62,-r*1.15); ctx.lineTo(r*0.14,-r*0.72); ctx.closePath(); ctx.fill();
  ctx.beginPath();                                  // 果凍身體
  ctx.moveTo(-r,r*0.35);
  ctx.bezierCurveTo(-r,-r*0.95,r,-r*0.95,r,r*0.35);
  ctx.bezierCurveTo(r*0.75,r*0.9,r*0.4,r*0.55,r*0.1,r*0.85);
  ctx.bezierCurveTo(-r*0.2,r*0.55,-r*0.6,r*0.95,-r,r*0.35);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(-r*0.35,-r*0.4,r*0.2,r*0.13,-0.5,0,6.3); ctx.fill();
  var blink=(time%3.6)<0.13;
  ctx.fillStyle='#12351c';
  if(blink){
    ctx.fillRect(-r*0.45,-r*0.1,r*0.28,r*0.055); ctx.fillRect(r*0.17,-r*0.1,r*0.28,r*0.055);
  }else{
    ctx.beginPath(); ctx.ellipse(-r*0.32,-r*0.1,r*0.11,r*0.15,0,0,6.3); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.32,-r*0.1,r*0.11,r*0.15,0,0,6.3); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(-r*0.28,-r*0.16,r*0.04,0,6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.36,-r*0.16,r*0.04,0,6.3); ctx.fill();
    ctx.fillStyle='#12351c';
  }
  ctx.beginPath(); ctx.moveTo(-r*0.08,r*0.13); ctx.lineTo(r*0.08,r*0.13); ctx.lineTo(0,r*0.24); ctx.closePath(); ctx.fill();
  ctx.restore();
}

  txt('本局分數',200,258,'rgba(255,255,255,.5)',12,'center');
  txt(String(o.score),200,292,'#eafff0',44,'center','bold');
  if(o.rec) txt('前一個紀錄被你踩爛了！',200,326,'#ffd479',14,'center','bold');
  else txt('差 '+o.diff+' 分破紀錄！',200,326,'#ffd479',17,'center','bold');
  ctx.fillStyle='rgba(255,255,255,.06)'; rr(48,344,304,64,12); ctx.fill();
  txt('線索',96,362,'rgba(255,255,255,.5)',11,'center');
  txt(o.clues+'/8',96,384,'#8ef0b0',17,'center','bold');
  txt('最高階',200,362,'rgba(255,255,255,.5)',11,'center');
  emo(TIERS[o.maxTier].e,200,386,24);
  txt('回合',304,362,'rgba(255,255,255,.5)',11,'center');
  txt(String(o.turn),304,384,'#dff5e6',17,'center','bold');
  txt(o.clues>=8?'案子破了，下一樁更難喵。':o.taunt,200,428,'rgba(255,255,255,.6)',12.5,'center');
  var a=0.6+0.4*Math.sin(time*4);
  ctx.globalAlpha=a;
  ctx.fillStyle='rgba(142,240,176,.22)'; rr(110,446,180,40,20); ctx.fill();
  ctx.strokeStyle='#8ef0b0'; ctx.lineWidth=2; ctx.stroke();
  ctx.globalAlpha=1;
  txt('再來一局',200,466,'#eafff0',17,'center','bold');
  txt('點任意處（或按 Enter）馬上重開',200,506,'rgba(255,255,255,.4)',11,'center');
}

/* ---------- 主繪製 ---------- */
function draw(){
  ctx.save();
  if(shake>0.15) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawBG();
  if(mode==='title'){ drawTitle(); ctx.restore(); return; }
  drawHUD(); drawOrderCard(); drawBoard(); drawFX(); drawBottom();
  if(toast) drawToast();
  if(mode==='over') drawOver();
  if(card) drawCard();
  ctx.restore();
}

/* ---------- 固定時間步長主迴圈（不依賴 60fps） ---------- */
var last=0, acc=0, STEP=1/60;
function frame(ts){
  requestAnimationFrame(frame);
  try{
    if(!last) last=ts;
    var dt=(ts-last)/1000; last=ts;
    if(!(dt>=0)) dt=0;
    if(dt>0.25) dt=0.25;
    acc+=dt;
    var n=0;
    while(acc>=STEP&&n<6){ update(STEP); acc-=STEP; n++; }
    if(n>=6) acc=0;
    draw();
  }catch(e){ /* 靜默保護：不輸出錯誤、不中斷迴圈 */ }
}
requestAnimationFrame(frame);
})();
</script>
