<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>喵藏三疊局</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d1410;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(circle at 50% 18%,#1d3324 0%,#0d1410 60%,#070a08 100%);
  }
  /* 回大廳連結 */
  a.back{
    position:fixed;left:10px;top:8px;z-index:20;
    color:#9fe8b4;text-decoration:none;font-size:13px;
    background:rgba(8,20,12,.72);border:1px solid rgba(120,220,150,.35);
    padding:5px 10px;border-radius:20px;backdrop-filter:blur(3px);
  }
  a.back:active{background:rgba(30,70,40,.9);}
  #wrap{line-height:0;}
  canvas{
    touch-action:none;display:block;
    border-radius:14px;
    box-shadow:0 10px 40px rgba(0,0,0,.65),0 0 0 1px rgba(140,230,170,.18);
  }
</style>

<body>
<a class="back" href="../../index.html">← 回遊戲區</a>
<div id="wrap"><canvas id="cv" width="400" height="600"></canvas></div>
<script>
(function(){
'use strict';

/* ============ 基本設定與高解析度輸出 ============ */
const W=400,H=600;                       // 邏輯座標固定 400x600
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d',{alpha:false});
let scale=1,dpr=1;

function resize(){
  const aw=window.innerWidth, ah=window.innerHeight;
  scale=Math.max(0.28,Math.min(aw/W,(ah-6)/H));
  dpr=Math.min(3,window.devicePixelRatio||1);   // dpr 上限 3
  cv.style.width=(W*scale)+'px';
  cv.style.height=(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr);
  cv.height=Math.round(H*scale*dpr);
  // 讓後續繪圖仍用 400x600 邏輯座標
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.textBaseline='alphabetic';
}
window.addEventListener('resize',resize,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});
resize();

/* ============ 音效（WebAudio 合成，零外部資源） ============ */
let AC=null;
function ac(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; AC=new C();}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
  return AC;
}
function tone(freq,dur,type,vol,slideTo,delay){
  const c=ac(); if(!c)return;
  try{
    const t0=c.currentTime+(delay||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.15),t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function noise(dur,vol,delay){
  const c=ac(); if(!c)return;
  try{
    const t0=c.currentTime+(delay||0);
    const n=Math.floor(c.sampleRate*dur);
    const b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(); s.buffer=b;
    const g=c.createGain(); g.gain.setValueAtTime(vol||0.12,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(t0);
  }catch(e){}
}
const SFX={
  pick(){ tone(560,0.07,'square',0.07,760); },
  land(){ tone(300,0.11,'triangle',0.13,440); noise(0.05,0.05); },
  block(){ tone(150,0.14,'sawtooth',0.08,110); },
  pop(n){ const b=620+Math.min(8,n)*70;
    tone(b,0.10,'sine',0.17,b*1.55); tone(b*1.5,0.13,'triangle',0.09,b*2.1,0.04);
    noise(0.09,0.10); },
  reveal(){ tone(880,0.16,'sine',0.10,1320); tone(1320,0.20,'sine',0.07,1760,0.06); },
  warn(){ tone(180,0.18,'sawtooth',0.10,150); },
  guard(){ tone(420,0.10,'triangle',0.12,620); tone(620,0.14,'triangle',0.10,880,0.09); },
  power(){ tone(500,0.09,'square',0.10,300); noise(0.10,0.08); },
  level(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.24,'triangle',0.13,f*1.01,i*0.085)); },
  record(){ [784,988,1175,1568].forEach((f,i)=>tone(f,0.3,'square',0.10,f,i*0.1)); noise(0.3,0.08); },
  over(){ [440,370,294,220].forEach((f,i)=>tone(f,0.3,'sawtooth',0.10,f*0.94,i*0.13)); }
};

/* ============ 亂數（每日挑戰用固定種子） ============ */
let rnd=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function seedOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

/* ============ 存檔 ============ */
const LSK='slimecat_meowstack_v1';
let save={best:0,dailyDate:'',dailyBest:0,streak:0,lastPlay:'',plays:0};
try{const r=localStorage.getItem(LSK); if(r){const o=JSON.parse(r); if(o&&typeof o==='object')save=Object.assign(save,o);} }catch(e){}
function persist(){ try{localStorage.setItem(LSK,JSON.stringify(save));}catch(e){} }

/* ============ 卡片款式 ============ */
const TYPES=[
  {e:'🐟',c:'#7fd4ff'},{e:'🥫',c:'#ffb35c'},{e:'🍗',c:'#ff9a8b'},
  {e:'🧶',c:'#c8a2ff'},{e:'🐾',c:'#8ef0a8'},{e:'🥛',c:'#dfe9ff'},
  {e:'🍥',c:'#ffc0dd'},{e:'🌿',c:'#a8e063'},{e:'⭐',c:'#ffe066'},
  {e:'🧀',c:'#ffd98a'},{e:'🍤',c:'#ff8f6b'},{e:'🎣',c:'#9fd0c0'}
];
const EMOJI_FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",system-ui,sans-serif';

/* ============ 版面幾何 ============ */
const BX=16,BY=76,BW=368,BH=364;        // 拼圖底圖／卡堆區
const CW=46,CH=46,CELLW=50,CELLH=46;    // 卡片與格距
const TRAY_Y=452,TSL=46,TGAP=2;
const BTN_U={x:34,y:516,w:152,h:48};
const BTN_S={x:214,y:516,w:152,h:48};

// 每一幅的疊層樣板 [欄,列]，總數必為 3 的倍數
const TPL=[
  [[5,3],[4,2],[2,2]],                 // 27 張 → 9 塊拼圖
  [[6,3],[5,2],[4,1],[2,2]],           // 36 張 → 12 塊
  [[6,3],[5,3],[4,2],[3,1],[2,2]]      // 48 張 → 16 塊
];

/* ============ 遊戲狀態 ============ */
const ST={TITLE:0,PLAY:1,LEVELUP:2,OVER:3};
let st=ST.TITLE;

let board=[],covers=[],coverSeq=[],coverIdx=0;
let tray=[],order=[],trayMax=7;
let score=0,level=1,combo=0,comboTimer=0,maxCombo=0,clears=0;
let undos=2,shuffles=1,guardLeft=1;
let flight=null,levelTimer=0,runTime=0;
let dailyMode=false,overSent=false,newRecord=false,recordCelebrated=false;
let shake=0,pulse=0,cursorId=-1,kbMode=false,pressBtn='';
let parts=[],floats=[],artFlash=0;
let freeCache=null;

/* ============ 小工具 ============ */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function txt(s,x,y,size,color,align,bold,font){
  ctx.font=(bold?'bold ':'')+size+'px '+(font||('system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif'));
  ctx.textAlign=align||'left'; ctx.fillStyle=color; ctx.fillText(s,x,y);
}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function easeOut(t){return 1-Math.pow(1-t,3);}
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=spd*(0.4+Math.random()*0.9);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:0.5+Math.random()*0.45,
      max:0.95,c:color,r:2+Math.random()*3.5});
  }
}
function floatText(s,x,y,color,size){
  floats.push({s:s,x:x,y:y,c:color,sz:size||18,life:1.0,max:1.0});
}

/* ============ 產生一幅盤面 ============ */
function buildSlots(tpl){
  const out=[];
  tpl.forEach(function(cfg,L){
    const cols=cfg[0],rows=cfg[1];
    const ox=(L%2?CELLW/2:0)-L*3;              // 交錯半格 → 造成上層壓住下層
    const oy=(L%2?CELLH/2:0)-L*7;
    const sx=BX+(BW-cols*CELLW)/2+CELLW/2+ox;
    const sy=BY+(BH-rows*CELLH)/2+CELLH/2+oy;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
      out.push({L:L,x:sx+c*CELLW,y:sy+r*CELLH});
  });
  return out;
}
function isFree(card){
  for(let i=0;i<board.length;i++){
    const d=board[i];
    if(d.taken||d===card||d.L<=card.L)continue;
    if(Math.abs(d.x-card.x)<CW-8&&Math.abs(d.y-card.y)<CH-8)return false;
  }
  return true;
}
function freeCards(){
  if(freeCache)return freeCache;
  const a=board.filter(function(c){return !c.taken&&isFree(c);});
  a.sort(function(p,q){return (p.y-q.y)||(p.x-q.x);});
  freeCache=a; return a;
}
function dirty(){freeCache=null;}

function buildLevel(lv){
  level=lv;
  const tpl=lv===1?TPL[0]:(lv===2?TPL[1]:TPL[2]);
  const slots=buildSlots(tpl);
  board=slots.map(function(s,i){return {id:i,L:s.L,x:s.x,y:s.y,type:0,taken:false,
    slimed:false,ap:-i*0.014,wob:0};});
  dirty();
  // 依「剝洋蔥順序」指派三張同款 → 保證本局一定有解（輸了是自己的決策）
  const nType=Math.min(TYPES.length,4+lv);
  let left=board.length;
  while(left>0){
    const t=Math.floor(rnd()*nType);
    for(let k=0;k<3;k++){
      dirty();
      let f=board.filter(function(c){return !c.taken&&isFree(c);});
      if(!f.length)f=board.filter(function(c){return !c.taken;});
      const p=f[Math.floor(rnd()*f.length)];
      p.type=t; p.taken=true; left--;
    }
  }
  board.forEach(function(c){c.taken=false;});
  dirty();
  // 第 3 幅起出現「黏液卡」：蓋著史萊姆看不出款式，拿之前就看得見風險（資訊遮蔽度＝難度）
  if(lv>=3){
    const p=Math.min(0.30,0.16+0.035*(lv-3));
    board.forEach(function(c){ if(c.L>=1&&rnd()<p)c.slimed=true; });
  }
  // 底圖拼圖塊
  const pieces=board.length/3;
  const cols=pieces===9?3:4,rows=pieces/cols;
  covers=[];
  const pw=BW/cols,ph=BH/rows;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
    covers.push({x:BX+c*pw,y:BY+r*ph,w:pw,h:ph,on:true,anim:0});
  coverSeq=covers.map(function(_,i){return i;});
  for(let i=coverSeq.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=coverSeq[i];coverSeq[i]=coverSeq[j];coverSeq[j]=t;}
  coverIdx=0;
  // 暫存格上限：越後面越窄（單一參數的難度曲線）
  trayMax=lv<=2?7:(lv<=4?6:5);
  tray=[];order=[];flight=null;combo=0;comboTimer=0;
  cursorId=-1;
  artFlash=0.6;
}

function newRun(daily){
  dailyMode=!!daily;
  rnd=daily?mulberry32(seedOf('meow-'+todayKey())):Math.random;
  score=0;clears=0;maxCombo=0;undos=2;shuffles=1;guardLeft=1;runTime=0;
  overSent=false;newRecord=false;recordCelebrated=false;
  parts=[];floats=[];shake=0;
  buildLevel(1);
  st=ST.PLAY;
}

/* ============ 暫存區操作 ============ */
function slotPos(i){
  const total=trayMax*(TSL+TGAP)-TGAP;
  const x0=(W-total)/2;
  return {x:x0+i*(TSL+TGAP)+TSL/2,y:TRAY_Y+TSL/2};
}
function targetGoal(){ return dailyMode?save.dailyBest:save.best; }

function pickCard(card){
  if(st!==ST.PLAY||flight)return;
  if(!isFree(card)){
    card.wob=0.36; SFX.block(); shake=Math.max(shake,2);
    floatText('被壓住了',card.x,card.y-24,'#ffb0b0',14);
    return;
  }
  card.taken=true; dirty();
  SFX.pick();
  // 同款相鄰排列，插進暫存區
  let idx=tray.length;
  for(let i=tray.length-1;i>=0;i--){ if(tray[i].type===card.type){idx=i+1;break;} }
  const ent={type:card.type,cid:card.id,slimed:card.slimed,flying:true};
  tray.splice(idx,0,ent); order.push(ent);
  const tp=slotPos(idx);
  flight={ent:ent,x0:card.x,y0:card.y,x1:tp.x,y1:tp.y,p:0,type:card.type,slimed:card.slimed};
  // 鍵盤游標移到附近的下一張
  const f=freeCards(); cursorId=f.length?f[0].id:-1;
}

function landFlight(){
  const e=flight.ent; flight=null;
  e.flying=false; e.slimed=false;    // 黏液卡進格才揭曉
  SFX.land();
  burst(slotPos(tray.indexOf(e)).x,slotPos(tray.indexOf(e)).y,'#9fe8b4',6,60);
  resolveTray();
}

function resolveTray(){
  const cnt={};
  tray.forEach(function(e){ if(!e.flying)cnt[e.type]=(cnt[e.type]||0)+1; });
  let hit=-1;
  for(const k in cnt){ if(cnt[k]>=3){hit=parseInt(k,10);break;} }
  if(hit>=0){
    const rm=[];
    for(let i=0;i<tray.length&&rm.length<3;i++) if(tray[i].type===hit&&!tray[i].flying)rm.push(tray[i]);
    rm.forEach(function(e){
      const i=tray.indexOf(e); const p=slotPos(i<0?0:i);
      burst(p.x,p.y,TYPES[hit].c,16,150);
      burst(p.x,p.y,'#ffffff',6,90);
      tray.splice(i,1);
      const j=order.indexOf(e); if(j>=0)order.splice(j,1);
    });
    clears++;
    combo=comboTimer>0?combo+1:1;
    comboTimer=5.0;
    if(combo>maxCombo)maxCombo=combo;
    const mult=Math.min(4,1+0.3*(combo-1));
    const gain=Math.round(100*(1+0.15*(level-1))*mult);
    score+=gain;
    SFX.pop(combo);
    shake=Math.max(shake,combo>=3?7:4);
    pulse=0.5;
    floatText('+'+gain,W/2,TRAY_Y-16,'#ffe98a',combo>=3?26:20);
    if(combo>=2)floatText('連鎖 ×'+combo+'！',W/2,TRAY_Y-42,combo>=4?'#ff9de0':'#9fe8b4',combo>=4?24:18);
    revealPiece();
    checkRecord();
    // 掀完整幅 → 過關演出
    if(board.every(function(c){return c.taken;})){
      const bonus=500*level;
      score+=bonus; checkRecord();
      st=ST.LEVELUP; levelTimer=1.9; SFX.level(); artFlash=1;
      floatText('第 '+level+' 幅完成！+'+bonus,W/2,BY+BH/2,'#ffffff',24);
      burst(W/2,BY+BH/2,'#9fe8b4',40,220);
      return;
    }
    // 消除後再跑一次（連續三消）
    resolveTray();
    return;
  }
  // 滿格判定
  if(tray.length>=trayMax){
    if(guardLeft>0){
      guardLeft--;
      const e=order.shift();
      const i=tray.indexOf(e); if(i>=0)tray.splice(i,1);
      const c=board[e.cid]; if(c){c.taken=false;c.ap=0.2;dirty();}
      SFX.guard();
      floatText('🛟 新手保護！退回最舊一張',W/2,TRAY_Y-24,'#9fe8ff',17);
      shake=Math.max(shake,5);
    }else{
      gameOver();
    }
  }else if(tray.length>=trayMax-1){
    SFX.warn();
  }
}

function revealPiece(){
  if(coverIdx>=coverSeq.length)return;
  const cv2=covers[coverSeq[coverIdx++]];
  cv2.anim=0.001;
  SFX.reveal();
  burst(cv2.x+cv2.w/2,cv2.y+cv2.h/2,'#ffe98a',14,130);
}

function checkRecord(){
  const g=targetGoal();
  if(score>g&&g>0&&!recordCelebrated){
    recordCelebrated=true;newRecord=true;
    SFX.record();
    floatText('🎉 破紀錄了！',W/2,150,'#ffe066',26);
    burst(W/2,150,'#ffe066',34,200);
    shake=Math.max(shake,8);
  }
  if(score>g)newRecord=true;
}

/* ============ 道具 ============ */
function doUndo(){
  if(st!==ST.PLAY||flight)return;
  if(undos<=0||!order.length){SFX.block();return;}
  undos--;
  const e=order.pop();
  const i=tray.indexOf(e); if(i>=0)tray.splice(i,1);
  const c=board[e.cid]; if(c){c.taken=false;c.ap=0.25;dirty();}
  SFX.power();
  floatText('↩ 撤回',W/2,TRAY_Y-16,'#9fe8ff',18);
  burst(c?c.x:W/2,c?c.y:TRAY_Y,'#9fe8ff',12,110);
}
function doShuffle(){
  if(st!==ST.PLAY||flight)return;
  const rest=board.filter(function(c){return !c.taken;});
  if(shuffles<=0||rest.length<2){SFX.block();return;}
  shuffles--;
  const ts=rest.map(function(c){return c.type;});
  for(let i=ts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=ts[i];ts[i]=ts[j];ts[j]=t;}
  rest.forEach(function(c,i){c.type=ts[i];c.ap=0.3;c.slimed=c.slimed&&Math.random()<0.6;});
  SFX.power(); shake=Math.max(shake,4);
  floatText('🌀 洗牌！',W/2,BY+BH/2,'#c8a2ff',24);
  burst(W/2,BY+BH/2,'#c8a2ff',26,180);
}

/* ============ 結束 ============ */
function gameOver(){
  if(st===ST.OVER)return;
  st=ST.OVER; SFX.over(); shake=8;
  const t=todayKey();
  // 連續來玩天數（明日再來的鉤子）
  const y=new Date(Date.now()-86400000);
  const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  if(save.lastPlay!==t){
    save.streak=(save.lastPlay===yk)?(save.streak||0)+1:1;
    save.lastPlay=t;
  }
  save.plays=(save.plays||0)+1;
  if(score>save.best)save.best=score;
  if(dailyMode){
    if(save.dailyDate!==t){save.dailyDate=t;save.dailyBest=0;}
    if(score>save.dailyBest)save.dailyBest=score;
  }
  persist();
  if(!overSent){
    overSent=true;
    try{ if (window.SC) SC.over(score); }catch(e){}
  }
}

/* ============ 更新 ============ */
function update(dt){
  runTime+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*26);
  if(pulse>0)pulse=Math.max(0,pulse-dt*2);
  if(artFlash>0)artFlash=Math.max(0,artFlash-dt*1.2);
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}

  for(let i=0;i<board.length;i++){
    const c=board[i];
    if(c.ap<1){c.ap=Math.min(1,c.ap+dt*3.2);}
    if(c.wob>0)c.wob=Math.max(0,c.wob-dt*2.2);
  }
  for(let i=0;i<covers.length;i++){
    const cvx=covers[i];
    if(cvx.on&&cvx.anim>0){cvx.anim+=dt*3.0;if(cvx.anim>=1){cvx.on=false;}}
  }
  if(flight){
    flight.p+=dt/0.18;
    if(flight.p>=1){flight.p=1;landFlight();}
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=340*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.y-=34*dt;f.life-=dt;
    if(f.life<=0)floats.splice(i,1);
  }
  if(st===ST.LEVELUP){
    levelTimer-=dt;
    if(levelTimer<=0){
      undos=Math.min(4,undos+1);
      if(level%2===0)shuffles=Math.min(3,shuffles+1);
      const prevMax=trayMax;
      buildLevel(level+1);
      if(trayMax<prevMax){
        floatText('⚠ 暫存格 −1（剩 '+trayMax+' 格）',W/2,TRAY_Y-22,'#ff9a9a',19);
        SFX.warn();
      }
      if(level===3)floatText('⚠ 出現黏液卡：拿了才知道款式',W/2,BY+40,'#9fe8b4',16);
      st=ST.PLAY;
    }
  }
}

/* ============ 繪圖：卡片 ============ */
function drawCard(x,y,type,slimed,sc,alpha,ring,dim,wob){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(x,y);
  if(wob)ctx.rotate(Math.sin(wob*40)*0.08);
  ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,.4)';
  rr(-CW/2+2,-CH/2+4,CW,CH,10);ctx.fill();
  if(slimed){
    const g=ctx.createLinearGradient(0,-CH/2,0,CH/2);
    g.addColorStop(0,'#67c47a');g.addColorStop(1,'#2f7b45');
    ctx.fillStyle=g;
  }else{
    const g=ctx.createLinearGradient(0,-CH/2,0,CH/2);
    g.addColorStop(0,'#fdfaf2');g.addColorStop(1,'#dcd3c2');
    ctx.fillStyle=g;
  }
  rr(-CW/2,-CH/2,CW,CH,10);ctx.fill();
  ctx.strokeStyle=slimed?'rgba(200,255,210,.55)':'rgba(90,70,50,.35)';
  ctx.lineWidth=1.6;ctx.stroke();
  if(slimed){
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath();ctx.ellipse(-9,-11,8,5,-0.4,0,Math.PI*2);ctx.fill();
    ctx.font='bold 22px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillStyle='#eafff0';ctx.fillText('?',0,8);
  }else{
    ctx.fillStyle=TYPES[type].c;
    ctx.globalAlpha=alpha*0.5;
    ctx.beginPath();ctx.arc(0,-1,15,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=alpha;
    ctx.font='24px '+EMOJI_FONT;ctx.textAlign='center';
    ctx.fillText(TYPES[type].e,0,7);
  }
  if(dim){
    ctx.fillStyle='rgba(6,14,10,.48)';
    rr(-CW/2,-CH/2,CW,CH,10);ctx.fill();
  }
  if(ring){
    ctx.strokeStyle='#ffe066';ctx.lineWidth=3;
    rr(-CW/2-3,-CH/2-3,CW+6,CH+6,12);ctx.stroke();
  }
  ctx.restore();
}

function drawBoard(){
  const list=board.filter(function(c){return !c.taken;});
  list.sort(function(p,q){return (p.L-q.L)||(p.y-q.y)||(p.x-q.x);});
  for(let i=0;i<list.length;i++){
    const c=list[i];
    if(c.ap<=0)continue;
    const t=clamp(c.ap,0,1);
    const sc=0.6+0.4*easeOut(t)+(c.wob>0?0.05:0);
    const free=isFree(c);
    drawCard(c.x,c.y-(free?2:0),c.type,c.slimed,sc,clamp(t*1.2,0,1),
      kbMode&&c.id===cursorId,!free,c.wob);
  }
}

/* ============ 繪圖：暫存區與 HUD ============ */
function drawTray(){
  const danger=tray.length>=trayMax-1;
  const pu=danger?(0.5+0.5*Math.sin(runTime*9)):0;
  for(let i=0;i<trayMax;i++){
    const p=slotPos(i);
    ctx.save();
    ctx.strokeStyle=danger?'rgba(255,120,120,'+(0.4+0.5*pu)+')':'rgba(150,220,175,.35)';
    ctx.lineWidth=2;ctx.setLineDash([5,4]);
    rr(p.x-TSL/2,p.y-TSL/2,TSL,TSL,9);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.04)';
    rr(p.x-TSL/2,p.y-TSL/2,TSL,TSL,9);ctx.fill();
    ctx.restore();
  }
  for(let i=0;i<tray.length;i++){
    const e=tray[i];
    if(e.flying)continue;
    const p=slotPos(i);
    const bump=(pulse>0&&i<3)?1+pulse*0.10:1;
    drawCard(p.x,p.y,e.type,false,0.93*bump,1,false,false,0);
  }
  if(flight){
    const t=easeOut(clamp(flight.p,0,1));
    const x=flight.x0+(flight.x1-flight.x0)*t;
    const y=flight.y0+(flight.y1-flight.y0)*t-Math.sin(Math.PI*t)*34;
    drawCard(x,y,flight.type,flight.slimed&&flight.p<0.6,1.05-0.1*t,1,false,false,0);
  }
  // 連鎖徽章
  if(combo>=2&&comboTimer>0){
    const a=clamp(comboTimer/1.2,0,1);
    ctx.save();ctx.globalAlpha=a;
    txt('連鎖 ×'+combo,W-16,TRAY_Y-10,17,combo>=4?'#ff9de0':'#ffe066','right',true);
    ctx.restore();
  }
}

/* ============ 主繪製 ============ */
function render(){
  ctx.save();
  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  }
  ctx.fillStyle='#0d1712';ctx.fillRect(-20,-20,W+40,H+40);

  if(st===ST.TITLE){
    drawTitle();
  }else{
    drawArt();
    drawCovers();
    drawBoard();
    drawTray();
    drawButtons();
    drawHUD();
    if(st===ST.LEVELUP)drawLevelUp();
  }

  // 粒子
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // 浮動文字
  for(let i=0;i<floats.length;i++){
    const f=floats[i];
    ctx.globalAlpha=clamp(f.life/f.max,0,1);
    ctx.font='bold '+f.sz+'px system-ui,"Noto Sans TC",sans-serif';
    ctx.textAlign='center';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.55)';
    ctx.strokeText(f.s,f.x,f.y);
    ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y);
  }
  ctx.globalAlpha=1;

  if(st===ST.OVER)drawOver();
  ctx.restore();
}

/* ============ 輸入 ============ */
function toLogical(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
function inBox(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}

function handleDown(p){
  ac();
  if(st===ST.TITLE){
    const b1={x:40,y:452,w:150,h:56},b2={x:210,y:452,w:150,h:56};
    if(inBox(p,b2)){pressBtn='d';newRun(true);return;}
    pressBtn='g';newRun(false);return;
  }
  if(st===ST.OVER){
    const px=34,py=132,pw=332;
    const b={x:px+36,y:py+198,w:pw-72,h:58};
    if(inBox(p,b)){pressBtn='r';newRun(dailyMode);return;}
    if(p.y>py+296&&p.y<py+324){st=ST.TITLE;return;}
    pressBtn='r';newRun(dailyMode);return;    // 零摩擦：點哪都重來
  }
  if(st!==ST.PLAY)return;
  if(inBox(p,BTN_U)){pressBtn='u';doUndo();return;}
  if(inBox(p,BTN_S)){pressBtn='s';doShuffle();return;}
  // 由最上層往下找卡片
  const list=board.filter(function(c){return !c.taken;});
  list.sort(function(a,b){return (b.L-a.L)||(b.y-a.y)||(b.x-a.x);});
  for(let i=0;i<list.length;i++){
    const c=list[i];
    if(Math.abs(p.x-c.x)<=CW/2&&Math.abs(p.y-c.y)<=CH/2){kbMode=false;pickCard(c);return;}
  }
}

cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{handleDown(toLogical(e));}catch(err){}
},{passive:false});
function clearPress(){pressBtn='';}
cv.addEventListener('pointerup',clearPress,{passive:true});
cv.addEventListener('pointercancel',clearPress,{passive:true});
cv.addEventListener('pointerleave',clearPress,{passive:true});
window.addEventListener('blur',function(){clearPress();},{passive:true});
window.addEventListener('contextmenu',function(e){e.preventDefault();});

function moveCursor(dx,dy){
  const f=freeCards(); if(!f.length){cursorId=-1;return;}
  kbMode=true;
  let cur=null;
  for(let i=0;i<f.length;i++)if(f[i].id===cursorId)cur=f[i];
  if(!cur){cursorId=f[0].id;return;}
  let best=null,bd=1e9;
  for(let i=0;i<f.length;i++){
    const c=f[i]; if(c===cur)continue;
    const ddx=c.x-cur.x,ddy=c.y-cur.y;
    if(dx){ if(ddx*dx<=4)continue; }
    if(dy){ if(ddy*dy<=4)continue; }
    const d=Math.abs(ddx)*(dx?1:3)+Math.abs(ddy)*(dy?1:3);
    if(d<bd){bd=d;best=c;}
  }
  if(best)cursorId=best.id;
}
window.addEventListener('keydown',function(e){
  const k=e.key;
  if([' ','Spacebar','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].indexOf(k)>=0)e.preventDefault();
  ac();
  if(st===ST.TITLE){ if(k===' '||k==='Enter'||k==='Spacebar')newRun(false); if(k==='d'||k==='D')newRun(true); return; }
  if(st===ST.OVER){ if(k===' '||k==='Enter'||k==='Spacebar')newRun(dailyMode); if(k==='Escape')st=ST.TITLE; return; }
  if(st!==ST.PLAY)return;
  if(k==='ArrowLeft')moveCursor(-1,0);
  else if(k==='ArrowRight')moveCursor(1,0);
  else if(k==='ArrowUp')moveCursor(0,-1);
  else if(k==='ArrowDown')moveCursor(0,1);
  else if(k===' '||k==='Spacebar'||k==='Enter'){
    kbMode=true;
    const f=freeCards(); if(!f.length)return;
    let cur=null; for(let i=0;i<f.length;i++)if(f[i].id===cursorId)cur=f[i];
    if(!cur){cursorId=f[0].id;cur=f[0];}
    pickCard(cur);
  }
  else if(k==='z'||k==='Z')doUndo();
  else if(k==='x'||k==='X')doShuffle();
},{passive:false});

/* ============ 主迴圈（固定時間步長，不受螢幕更新率影響） ============ */
let last=0,acc=0;
const STEP=1/60;
function frame(ts){
  try{
    if(!last)last=ts;
    let dt=(ts-last)/1000; last=ts;
    if(dt>0.25)dt=0.25;
    acc+=dt;
    let guard=0;
    while(acc>=STEP&&guard<8){update(STEP);acc-=STEP;guard++;}
    if(guard>=8)acc=0;
    render();
  }catch(e){ /* 保底：不讓例外中斷迴圈 */ }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
