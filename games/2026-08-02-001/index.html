<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>肉球煉膳坊</title>
<style>
  /* 全站基本樣式：暗色廚房調，禁止捲動 */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#0d1117;}
  body{
    display:flex;flex-direction:column;align-items:center;
    background:radial-gradient(circle at 50% 0%,#1d2a38 0%,#0d1117 70%);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  /* 回大廳連結（獨立一列，不蓋到 canvas） */
  .bar{height:30px;width:100%;display:flex;align-items:center;padding-left:10px;flex:0 0 auto;}
  .bar a{color:#8fb8d8;text-decoration:none;font-size:13px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.06);}
  .bar a:active{background:rgba(255,255,255,.16);}

<body>
<div class="bar"><a href="../../index.html">← 回遊戲區</a></div>
<div class="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
'use strict';

/* ===== 基本設定 ===== */
var W=400,H=600,DT=1/60;
var FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
var scale=1;

/* 高解析度輸出：實體緩衝 = 顯示尺寸 × dpr(上限3)，邏輯座標維持 400×600 */
function resize(){
  var availH=window.innerHeight-34, availW=window.innerWidth;
  scale=Math.min(availW/W, availH/H);
  if(!(scale>0.05)) scale=0.05;
  var dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=(W*scale)+'px';
  cv.style.height=(H*scale)+'px';
  cv.width=Math.max(1,Math.round(W*scale*dpr));
  cv.height=Math.max(1,Math.round(H*scale*dpr));
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);

/* ===== 音效（WebAudio 合成，零外部資源） ===== */
var AC=null, muted=false;
function ac(){
  try{
    if(!AC){ var A=window.AudioContext||window.webkitAudioContext; if(!A) return null; AC=new A(); }
    if(AC.state==='suspended'&&AC.resume) AC.resume();
  }catch(e){ AC=null; }
  return AC;
}
function tone(f1,f2,dur,type,vol,delay){
  if(muted) return;
  var a=ac(); if(!a) return;
  try{
    var t0=a.currentTime+(delay||0);
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f1,t0);
    if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.16),t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function noise(dur,vol,freq,delay){
  if(muted) return;
  var a=ac(); if(!a) return;
  try{
    var t0=a.currentTime+(delay||0);
    var n=Math.floor(a.sampleRate*dur);
    var buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
    var s=a.createBufferSource(); s.buffer=buf;
    var f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(freq||900,t0);
    var g=a.createGain();
    g.gain.setValueAtTime(vol||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t0); s.stop(t0+dur+0.02);
  }catch(e){}
}
function sPlace(){ tone(360,520,0.09,'triangle',0.12); }
function sMerge(k){ var b=300+k*70; tone(b,b*2.1,0.16,'triangle',0.18); tone(b*1.5,b*3,0.1,'sine',0.09,0.03); }
function sCombo(n){ tone(600+n*90,1200+n*120,0.12,'square',0.07); }
function sOrder(){ tone(523,523,0.1,'triangle',0.16); tone(659,659,0.1,'triangle',0.16,0.09); tone(880,1100,0.22,'triangle',0.18,0.18); }
function sFail(){ tone(220,110,0.3,'sawtooth',0.14); noise(0.25,0.16,600); }
function sJunk(){ noise(0.22,0.24,420); tone(120,70,0.22,'sine',0.12); }
function sBreak(){ noise(0.32,0.3,2200); tone(900,200,0.26,'square',0.1); }
function sBoom(){ noise(0.5,0.34,1400); tone(180,60,0.45,'sawtooth',0.2); tone(700,1600,0.3,'triangle',0.12); }
function sRecord(){ var s=[523,659,784,1046]; for(var i=0;i<4;i++) tone(s[i],s[i],0.16,'triangle',0.16,i*0.1); }
function sOver(){ tone(440,110,0.55,'sawtooth',0.15); tone(330,80,0.6,'sine',0.12,0.08); }
function sPick(){ tone(500,620,0.05,'sine',0.07); }
function sBlock(){ tone(700,900,0.09,'square',0.09); noise(0.1,0.1,1800); }

/* ===== 肉球階級表（史萊姆貓宇宙原創配色） ===== */
var TIERS=[
  null,
  {n:'生肉球',   c:'#9be36b', d:'#5f9c3c'},
  {n:'酥烤肉球', c:'#ffd45e', d:'#b08a1e'},
  {n:'蜜汁肉球', c:'#ff9f45', d:'#b05f16'},
  {n:'莓果肉球', c:'#ff6b8a', d:'#a5304c'},
  {n:'星霜肉球', c:'#b98cff', d:'#6b45b0'},
  {n:'冰晶肉球', c:'#4fd6ff', d:'#1d7fa5'},
  {n:'熔岩肉球', c:'#ff5757', d:'#a11f1f'},
  {n:'喵神肉球', c:'#ffe27a', d:'#c99b17'}
];
var MAXT=8;
var PTS=[0,0,6,16,40,100,240,560,1300];   /* 疊合成第 k 階的基礎分（指數獎勵） */
var RAD=[0,17,19,21,23,25,26,27,28];      /* 階級越高體積越大 */

/* ===== 棋盤 ===== */
var COLS=5,ROWS=5,CELL=64,GX=40,GY=158;
var N=COLS*ROWS;
var grid=new Array(N);
function cx(i){ return GX+(i%COLS)*CELL+CELL/2; }
function cy(i){ return GY+Math.floor(i/COLS)*CELL+CELL/2; }
function cellAt(x,y){
  if(x<GX||y<GY||x>=GX+COLS*CELL||y>=GY+ROWS*CELL) return -1;
  var c=Math.floor((x-GX)/CELL), r=Math.floor((y-GY)/CELL);
  return r*COLS+c;
}

/* ===== 遊戲狀態 ===== */
var state='title';
var score=0,best=0,bestTier=1,todayBest=0;
var time=0, placed=0, merged=0, ordersDone=0, junkCount=0, runMaxTier=1;
var discovered={}, comboN=0, comboT=0, comboMul=1;
var queue=[], selected=-1, dragIdx=-1, cursor=12, keyMode=false;
var warns=[], particles=[], floats=[], flyers=[], rings=[];
var order=null, orderCD=22, nextJunk=1e9;
var shakeT=0, shakeM=0, flashT=0, flashC='#fff';
var recordBroken=false, overSent=false, tutorial=0;
var pd=null, hintT=0, overT=0;

var OR={x:20,y:88,w:360,h:56};

/* ===== 存檔 ===== */
function load(){
  try{
    best=parseInt(localStorage.getItem('lqlf_best')||'0',10)||0;
    bestTier=parseInt(localStorage.getItem('lqlf_tier')||'1',10)||1;
    var raw=localStorage.getItem('lqlf_day');
    if(raw){ var o=JSON.parse(raw); if(o&&o.d===dayKey()) todayBest=o.s||0; }
  }catch(e){}
}
function dayKey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function save(){
  try{
    if(score>best){ best=score; localStorage.setItem('lqlf_best',String(best)); }
    if(runMaxTier>bestTier){ bestTier=runMaxTier; localStorage.setItem('lqlf_tier',String(bestTier)); }
    if(score>todayBest){ todayBest=score; localStorage.setItem('lqlf_day',JSON.stringify({d:dayKey(),s:todayBest})); }
  }catch(e){}
}

/* ===== 特效小工具 ===== */
function burst(x,y,n,col,sp,sz){
  for(var i=0;i<n;i++){
    if(particles.length>320) break;
    var a=Math.random()*Math.PI*2, v=sp*(0.35+Math.random()*0.9);
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-18,l:0,m:0.35+Math.random()*0.5,c:col,r:sz*(0.5+Math.random())});
  }
}
function ft(x,y,txt,col,sz){ floats.push({x:x,y:y,t:txt,c:col,s:sz||16,l:0,m:0.95}); }
function ring(x,y,col,r0,r1){ rings.push({x:x,y:y,c:col,l:0,m:0.45,r0:r0,r1:r1}); }
function shake(m,d){ if(m>shakeM) shakeM=m; shakeT=Math.max(shakeT,d); }
function flash(c,t){ flashC=c; flashT=Math.max(flashT,t); }

/* ===== 開新局 ===== */
function reset(){
  for(var i=0;i<N;i++) grid[i]=null;
  score=0; time=0; placed=0; merged=0; ordersDone=0; junkCount=0; runMaxTier=1;
  discovered={1:true}; comboN=0; comboT=0; comboMul=1;
  queue=[]; for(var k=0;k<4;k++) queue.push(rollTier());
  selected=-1; dragIdx=-1; cursor=12; keyMode=false;
  warns.length=0; particles.length=0; floats.length=0; flyers.length=0; rings.length=0;
  order=null; orderCD=22; nextJunk=45;
  recordBroken=false; overSent=false; tutorial=0; overT=0;
  /* 開局先送兩顆同款當引導：保證第一次疊合必定成功 */
  grid[11]=mk(1); grid[13]=mk(1);
  state='play';
}
function mk(t){ return {tier:t,s:0.2,vs:6,ph:Math.random()*6.28,glow:0}; }

/* 補貨階級：時間越久越容易拿到高階，讓中後期成長不封頂 */
function rollTier(){
  var r=Math.random();
  if(time<60) return 1;
  if(time<110) return r<0.22?2:1;
  if(time<160) return r<0.08?3:(r<0.40?2:1);
  return r<0.14?3:(r<0.52?2:1);
}

/* ===== 動作 ===== */
function place(i){
  if(state!=='play'||i<0||i>=N||grid[i]) return false;
  var t=queue.shift(); queue.push(rollTier());
  grid[i]=mk(t); grid[i].s=0.3; grid[i].vs=9;
  placed++; score+=1;
  burst(cx(i),cy(i),8,TIERS[t].c,90,3);
  ring(cx(i),cy(i),TIERS[t].c,10,34);
  sPlace();
  /* 蓋在焦塊預警上 → 擋掉這一顆焦塊（看得見、來得及反應的隨機性） */
  for(var w=warns.length-1;w>=0;w--){
    if(warns[w].i===i){
      warns.splice(w,1);
      ft(cx(i),cy(i)-26,'擋掉了！','#7ef7c8',15);
      burst(cx(i),cy(i),14,'#7ef7c8',140,3); sBlock(); score+=8;
    }
  }
  checkOver();
  return true;
}

function doMerge(a,b){
  /* a 疊到 b 上 */
  var p=grid[a], q=grid[b];
  if(!p||!q||p.tier<1||q.tier<1||p.tier!==q.tier) return false;
  var k=p.tier+1;
  flyers.push({x0:cx(a),y0:cy(a),x1:cx(b),y1:cy(b),t:0,m:0.13,tier:p.tier});
  grid[a]=null;
  if(k>MAXT){
    /* 兩顆喵神肉球 → 喵神爆發：清空全部焦塊 */
    grid[b]=null;
    score+=3000;
    burst(cx(b),cy(b),90,'#ffe27a',360,6);
    ring(cx(b),cy(b),'#fff3b0',10,260); ring(cx(b),cy(b),'#ffd45e',10,180);
    ft(200,300,'喵神爆發！ +3000','#ffe27a',26);
    clearAllJunk();
    shake(16,0.6); flash('#fff6c9',0.35); sBoom();
    checkOver(); return true;
  }
  grid[b]=mk(k); grid[b].s=1.7; grid[b].vs=-2; grid[b].glow=1;
  merged++;
  runMaxTier=Math.max(runMaxTier,k);

  /* 連鎖倍率 */
  comboT=3.2;
  comboN++;
  comboMul=Math.min(3,1+0.25*(comboN-1));
  var gain=Math.round(PTS[k]*comboMul);
  score+=gain;

  ft(cx(b),cy(b)-30,'+'+gain,'#fff',comboN>1?20:17);
  if(comboN>1){ ft(cx(b),cy(b)-52,'連鎖 x'+comboMul.toFixed(2).replace(/0$/,''),'#ffd45e',15); sCombo(comboN); }
  burst(cx(b),cy(b),12+k*3,TIERS[k].c,120+k*18,3+k*0.4);
  ring(cx(b),cy(b),TIERS[k].c,12,40+k*6);
  sMerge(k); shake(2+k*0.9,0.16);

  if(!discovered[k]){
    discovered[k]=true;
    ft(200,132,'新食譜解鎖：'+TIERS[k].n+'！','#ffe27a',18);
    ring(cx(b),cy(b),'#ffe27a',14,90); flash('#ffffff',0.12); sRecord();
  }
  /* 5 階以上疊合 → 震波震碎相鄰焦塊（唯一能主動清焦塊的爽點） */
  if(k>=5) shockwave(b,k);
  checkOver();
  return true;
}

function shockwave(i,k){
  var col=i%COLS, row=Math.floor(i/COLS), broke=0;
  for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
    if(!dx&&!dy) continue;
    var c=col+dx, r=row+dy;
    if(c<0||c>=COLS||r<0||r>=ROWS) continue;
    var j=r*COLS+c;
    if(grid[j]&&grid[j].tier===-1){
      grid[j]=null; junkCount--; broke++;
      burst(cx(j),cy(j),16,'#9aa6b2',150,3);
      ring(cx(j),cy(j),'#ffffff',8,44);
    }
  }
  ring(cx(i),cy(i),'#ffffff',16,110);
  if(broke>0){
    score+=30*broke;
    ft(cx(i),cy(i)+34,'震碎焦塊 x'+broke,'#7ef7c8',15);
    sBreak(); shake(9,0.3);
  }else{
    shake(5,0.2); sBreak();
  }
}

function clearJunk(n){
  var cleared=0;
  for(var i=0;i<N&&cleared<n;i++){
    if(grid[i]&&grid[i].tier===-1){
      grid[i]=null; junkCount--; cleared++;
      burst(cx(i),cy(i),14,'#7ef7c8',140,3);
      ring(cx(i),cy(i),'#7ef7c8',8,40);
    }
  }
  return cleared;
}
function clearAllJunk(){ var c=0; for(var i=0;i<N;i++){ if(grid[i]&&grid[i].tier===-1){ burst(cx(i),cy(i),12,'#7ef7c8',140,3); grid[i]=null; junkCount--; c++; } } return c; }

function moveTo(a,b){
  if(!grid[a]||grid[b]||grid[a].tier<1) return false;
  grid[b]=grid[a]; grid[a]=null; grid[b].s=1.25; grid[b].vs=0;
  sPick(); return true;
}

function deliver(i){
  if(!order||!grid[i]||grid[i].tier!==order.tier) return false;
  var pts=Math.round(40*order.tier*(order.urgent?2:1));
  score+=pts;
  flyers.push({x0:cx(i),y0:cy(i),x1:OR.x+52,y1:OR.y+28,t:0,m:0.22,tier:grid[i].tier});
  grid[i]=null;
  ordersDone++;
  var cl=clearJunk(order.urgent?3:2);
  ft(200,OR.y+16,'訂單完成！ +'+pts,'#7ef7c8',20);
  if(cl>0) ft(200,OR.y+44,'清除焦塊 x'+cl,'#7ef7c8',15);
  burst(OR.x+52,OR.y+28,26,'#7ef7c8',180,4);
  ring(OR.x+52,OR.y+28,'#7ef7c8',10,70);
  sOrder(); shake(5,0.25); flash('#8ff0d0',0.1);
  order=null;
  orderCD=Math.max(4.5,9-time/40);
  checkOver();
  return true;
}

function newOrder(){
  var cap=Math.max(3,Math.min(runMaxTier,3+Math.floor(time/70)));
  var lv=Math.max(3,Math.min(cap,runMaxTier));
  if(lv>MAXT-1) lv=MAXT-1;
  var urgent=(time>110&&Math.random()<0.28);
  var lim=urgent?15:Math.max(20,34-time*0.06);
  order={tier:lv,t:lim,max:lim,urgent:urgent};
  ft(200,OR.y+50,urgent?'急件訂單來了！':'新訂單！','#ffd45e',16);
  tone(880,1200,0.12,'triangle',0.14);
}
function failOrder(){
  ft(200,OR.y+30,'訂單逾期！焦塊 x2','#ff6b6b',18);
  sFail(); shake(7,0.35); flash('#ff5a5a',0.14);
  for(var k=0;k<2;k++) dropJunk();
  order=null;
  orderCD=Math.max(4.5,9-time/40);
  checkOver();
}

function emptyCells(){ var a=[]; for(var i=0;i<N;i++) if(!grid[i]) a.push(i); return a; }
function dropJunk(){
  var e=emptyCells();
  if(!e.length) return;
  var i=e[Math.floor(Math.random()*e.length)];
  grid[i]={tier:-1,s:1.6,vs:-1,ph:0,glow:0};
  junkCount++;
  burst(cx(i),cy(i),12,'#6b7480',120,3);
  sJunk(); shake(4,0.2);
}
function scheduleJunk(){
  var e=emptyCells();
  if(!e.length) return;
  var used={};
  for(var w=0;w<warns.length;w++) used[warns[w].i]=1;
  var pool=[];
  for(var k=0;k<e.length;k++) if(!used[e[k]]) pool.push(e[k]);
  if(!pool.length) return;
  var i=pool[Math.floor(Math.random()*pool.length)];
  warns.push({i:i,t:2.0,m:2.0});
  tone(240,190,0.14,'square',0.06);
}

function canMerge(){
  var cnt={};
  for(var i=0;i<N;i++){
    var g=grid[i];
    if(g&&g.tier>0){ cnt[g.tier]=(cnt[g.tier]||0)+1; if(cnt[g.tier]>=2) return true; }
  }
  return false;
}
function checkOver(){
  if(state!=='play') return;
  var full=true;
  for(var i=0;i<N;i++) if(!grid[i]){ full=false; break; }
  if(full&&!canMerge()) gameOver();
}
function gameOver(){
  if(state==='over') return;
  state='over'; overT=0;
  save();
  sOver(); shake(10,0.5); flash('#ff4d4d',0.2);
  for(var i=0;i<N;i++) if(grid[i]) burst(cx(i),cy(i),6,'#5a6675',80,3);
  if(!overSent){ overSent=true; if(window.SC) SC.over(score); }
}

/* ===== 更新 ===== */
function update(dt){
  /* 特效永遠更新（標題與結算畫面也有動態） */
  var i;
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.l+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=520*dt; p.vx*=0.985;
    if(p.l>=p.m) particles.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){
    var f=floats[i]; f.l+=dt; f.y-=42*dt;
    if(f.l>=f.m) floats.splice(i,1);
  }
  for(i=flyers.length-1;i>=0;i--){
    var fl=flyers[i]; fl.t+=dt; if(fl.t>=fl.m) flyers.splice(i,1);
  }
  for(i=rings.length-1;i>=0;i--){
    var rg=rings[i]; rg.l+=dt; if(rg.l>=rg.m) rings.splice(i,1);
  }
  if(shakeT>0){ shakeT-=dt; if(shakeT<=0){ shakeT=0; shakeM=0; } }
  if(flashT>0) flashT-=dt;
  if(hintT>0) hintT-=dt;
  if(state==='over') overT+=dt;

  /* 肉球彈簧動畫 */
  for(i=0;i<N;i++){
    var g=grid[i];
    if(g){
      var a=(1-g.s)*190-g.vs*14;
      g.vs+=a*dt; g.s+=g.vs*dt;
      if(g.glow>0) g.glow-=dt*1.6;
    }
  }

  if(state!=='play') return;
  time+=dt;

  /* 連鎖視窗 */
  if(comboT>0){ comboT-=dt; if(comboT<=0){ comboN=0; comboMul=1; } }

  /* 訂單節奏（慢／快心跳切換） */
  if(order){
    order.t-=dt;
    if(order.t<=0) failOrder();
  }else{
    orderCD-=dt;
    if(orderCD<=0&&time>20&&runMaxTier>=2) newOrder();
  }

  /* 焦塊：預警 → 落下（看得見、來得及反應） */
  if(time>=45){
    nextJunk-=dt;
    if(nextJunk<=0){
      var interval=Math.max(6,15-(time-45)*0.06);
      scheduleJunk();
      if(time>150) scheduleJunk();   /* 第 3 分鐘的新壓力源：雙焦塊 */
      nextJunk=interval;
    }
  }
  for(i=warns.length-1;i>=0;i--){
    var w=warns[i]; w.t-=dt;
    if(w.t<=0){
      warns.splice(i,1);
      if(!grid[w.i]){
        grid[w.i]={tier:-1,s:1.7,vs:-2,ph:0,glow:0};
        junkCount++;
        burst(cx(w.i),cy(w.i),14,'#6b7480',150,3);
        ring(cx(w.i),cy(w.i),'#8b95a3',8,40);
        sJunk(); shake(5,0.22);
        checkOver();
      }
    }
  }

  /* 破紀錄慶祝（局中即時） */
  if(!recordBroken&&best>0&&score>best){
    recordBroken=true;
    ft(200,250,'破紀錄！','#ffe27a',30);
    burst(200,250,50,'#ffe27a',260,5);
    ring(200,250,'#ffe27a',10,180);
    flash('#fff0b8',0.2); sRecord();
  }
}

/* ===== 繪圖工具 ===== */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function F(sz,w){ ctx.font=(w||'700')+' '+sz+'px '+FONT; }

/* 史萊姆貓肉球：果凍身體 + 貓耳 + 表情 */
function drawPaw(x,y,r,tier,sq,alpha,glow){
  var T=TIERS[tier]; if(!T) return;
  ctx.save();
  if(alpha!==undefined) ctx.globalAlpha=alpha;
  var rx=r*(1+sq), ry=r*(1-sq);
  if(glow>0){
    ctx.globalAlpha=(alpha===undefined?1:alpha)*Math.min(1,glow)*0.6;
    ctx.fillStyle=T.c;
    ctx.beginPath(); ctx.arc(x,y,r*1.55,0,6.2832); ctx.fill();
    ctx.globalAlpha=(alpha===undefined?1:alpha);
  }
  /* 貓耳 */
  ctx.fillStyle=T.d;
  ctx.beginPath();
  ctx.moveTo(x-rx*0.72,y-ry*0.42); ctx.lineTo(x-rx*0.46,y-ry*1.18); ctx.lineTo(x-rx*0.12,y-ry*0.62); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+rx*0.72,y-ry*0.42); ctx.lineTo(x+rx*0.46,y-ry*1.18); ctx.lineTo(x+rx*0.12,y-ry*0.62); ctx.closePath(); ctx.fill();
  /* 果凍身體 */
  var g=ctx.createLinearGradient(x,y-ry,x,y+ry*1.1);
  g.addColorStop(0,T.c); g.addColorStop(1,T.d);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x-rx,y+ry*0.5);
  ctx.bezierCurveTo(x-rx,y-ry*1.05,x+rx,y-ry*1.05,x+rx,y+ry*0.5);
  ctx.quadraticCurveTo(x+rx*0.62,y+ry*1.14,x,y+ry*1.04);
  ctx.quadraticCurveTo(x-rx*0.62,y+ry*1.14,x-rx,y+ry*0.5);
  ctx.closePath(); ctx.fill();
  /* 高光 */
  ctx.fillStyle='rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(x-rx*0.34,y-ry*0.36,rx*0.24,ry*0.16,-0.5,0,6.2832); ctx.fill();
  /* 眼睛與嘴 */
  ctx.fillStyle='rgba(24,28,34,.85)';
  ctx.beginPath(); ctx.arc(x-rx*0.3,y+ry*0.08,Math.max(1.6,rx*0.093),0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x+rx*0.3,y+ry*0.08,Math.max(1.6,rx*0.093),0,6.2832); ctx.fill();
  ctx.strokeStyle='rgba(24,28,34,.7)'; ctx.lineWidth=Math.max(1,r*0.06);
  ctx.beginPath(); ctx.arc(x,y+ry*0.2,rx*0.17,0.25,2.89); ctx.stroke();
  /* 階級徽章 */
  if(r>13){
    ctx.fillStyle='rgba(12,16,22,.55)';
    ctx.beginPath(); ctx.arc(x+rx*0.66,y+ry*0.68,r*0.28,0,6.2832); ctx.fill();
    ctx.fillStyle='#fff'; F(Math.round(r*0.42)); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(tier),x+rx*0.66,y+ry*0.7+0.5);
  }
  ctx.restore();
}
/* 焦塊：不能動也不能疊，只能靠訂單或 5 階震波清掉 */
function drawJunk(x,y,r,sq){
  ctx.save();
  var rx=r*(1+sq), ry=r*(1-sq);
  ctx.fillStyle='#39424f';
  ctx.beginPath();
  for(var i=0;i<9;i++){
    var a=i/9*6.2832, rr2=(i%2?0.78:1)*1;
    var px=x+Math.cos(a)*rx*rr2, py=y+Math.sin(a)*ry*rr2;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#59636f'; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle='#8d97a3'; ctx.lineWidth=Math.max(1.4,r*0.1);
  ctx.beginPath();
  ctx.moveTo(x-rx*0.32,y-ry*0.16); ctx.lineTo(x-rx*0.12,y+ry*0.04);
  ctx.moveTo(x-rx*0.12,y-ry*0.16); ctx.lineTo(x-rx*0.32,y+ry*0.04);
  ctx.moveTo(x+rx*0.12,y-ry*0.16); ctx.lineTo(x+rx*0.32,y+ry*0.04);
  ctx.moveTo(x+rx*0.32,y-ry*0.16); ctx.lineTo(x+rx*0.12,y+ry*0.04);
  ctx.stroke();
  ctx.restore();
}

/* ===== 主繪製 ===== */
function draw(){
  ctx.save();
  if(shakeT>0){
    var m=shakeM*(shakeT/0.5);
    ctx.translate((Math.random()-0.5)*m,(Math.random()-0.5)*m);
  }
  /* 背景 */
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1b2836'); bg.addColorStop(0.55,'#141d28'); bg.addColorStop(1,'#0e141c');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.018)';
  for(var s=0;s<8;s++) ctx.fillRect(0,s*80+((time*6)%80)-80,W,26);

  if(state==='title'){ drawTitle(); ctx.restore(); return; }

  drawHUD();
  drawLadder();
  drawOrder();
  drawBoard();
  drawSupply();
  drawFX();
  if(state==='over') drawOver();

  if(flashT>0){
    ctx.globalAlpha=Math.min(0.6,flashT*2.4);
    ctx.fillStyle=flashC; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawLadder(){
  /* 食譜圖鑑：永遠可見的未完成清單（收集慾 + 看得到終點） */
  for(var i=1;i<=MAXT;i++){
    var x=53+(i-1)*42, y=66;
    var got=!!discovered[i];
    if(order&&order.tier===i){
      var pr=0.5+Math.sin(time*7)*0.5;
      ctx.strokeStyle='rgba(255,212,94,'+(0.35+pr*0.6)+')'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(x,y,17+pr*2,0,6.2832); ctx.stroke();
    }
    if(got){
      drawPaw(x,y,12,i,Math.sin(time*2+i)*0.04,1,0);
    }else{
      ctx.fillStyle='rgba(255,255,255,.06)';
      ctx.beginPath(); ctx.arc(x,y,12,0,6.2832); ctx.fill();
      ctx.fillStyle=(i<=bestTier)?'rgba(255,226,122,.45)':'rgba(255,255,255,.22)';
      F(13); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(i<=bestTier?String(i):'?',x,y+1);
      ctx.textBaseline='alphabetic';
    }
    if(i===MAXT&&!discovered[i]){
      ctx.strokeStyle='rgba(255,226,122,.35)'; ctx.lineWidth=1.5;
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.arc(x,y,15,0,6.2832); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

    ctx.lineWidth=2; rr(OR.x,OR.y,OR.w,OR.h,12); ctx.stroke();

function drawBoard(){
  /* 底板 */
  ctx.fillStyle='rgba(255,255,255,.04)'; rr(GX-6,GY-6,COLS*CELL+12,ROWS*CELL+12,14); ctx.fill();
  var full=true;
  for(var i=0;i<N;i++) if(!grid[i]) full=false;
  if(full){
    ctx.strokeStyle='rgba(255,90,90,'+(0.3+Math.sin(time*9)*0.3)+')'; ctx.lineWidth=3;
    rr(GX-6,GY-6,COLS*CELL+12,ROWS*CELL+12,14); ctx.stroke();
  }
  /* 格子 */
  for(i=0;i<N;i++){
    var x=GX+(i%COLS)*CELL+3, y=GY+Math.floor(i/COLS)*CELL+3;
    ctx.fillStyle='rgba(0,0,0,.22)'; rr(x,y,CELL-6,CELL-6,10); ctx.fill();
  }
  /* 焦塊預警（提前 2 秒，來得及反應） */
  for(i=0;i<warns.length;i++){
    var w=warns[i], px=cx(w.i), py=cy(w.i), pr2=1-w.t/w.m;
    ctx.save();
    ctx.strokeStyle='rgba(255,110,110,'+(0.45+Math.sin(time*14)*0.35)+')';
    ctx.lineWidth=3; ctx.setLineDash([5,4]);
    rr(px-CELL/2+4,py-CELL/2+4,CELL-8,CELL-8,10); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle='#ff6b6b'; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(px,py,16,-1.5708,-1.5708+6.2832*pr2); ctx.stroke();
    ctx.fillStyle='rgba(255,140,140,.8)'; F(11); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('焦',px,py+1);
    ctx.textBaseline='alphabetic';
    ctx.restore();
  }
  /* 可疊合目標高亮 */
  var srcTier=-99;
  if(dragIdx>=0&&grid[dragIdx]) srcTier=grid[dragIdx].tier;
  else if(selected>=0&&grid[selected]) srcTier=grid[selected].tier;
  if(srcTier>0){
    for(i=0;i<N;i++){
      if(i===dragIdx||i===selected) continue;
      if(grid[i]&&grid[i].tier===srcTier){
        var g2=0.4+Math.sin(time*9)*0.3;
        ctx.strokeStyle='rgba(255,226,122,'+(0.5+g2*0.5)+')'; ctx.lineWidth=3;
        rr(GX+(i%COLS)*CELL+4,GY+Math.floor(i/COLS)*CELL+4,CELL-8,CELL-8,10); ctx.stroke();
      }
    }
  }
  /* 選取框 */
  if(selected>=0&&grid[selected]){
    ctx.strokeStyle='#7ef7c8'; ctx.lineWidth=3;
    rr(GX+(selected%COLS)*CELL+3,GY+Math.floor(selected/COLS)*CELL+3,CELL-6,CELL-6,10); ctx.stroke();
  }
  /* 鍵盤游標 */
  if(keyMode){
    ctx.strokeStyle='rgba(159,232,255,.9)'; ctx.lineWidth=2.5; ctx.setLineDash([6,4]);
    rr(GX+(cursor%COLS)*CELL+2,GY+Math.floor(cursor/COLS)*CELL+2,CELL-4,CELL-4,10); ctx.stroke();
    ctx.setLineDash([]);
  }
  /* 肉球 */
  for(i=0;i<N;i++){
    var g=grid[i];
    if(!g) continue;
    if(i===dragIdx&&pd&&pd.moved) continue;
    var sq=Math.sin(time*2.6+g.ph)*0.035;
    var r=(g.tier>0?RAD[g.tier]:21)*Math.max(0.05,g.s);
    /* 訂單可交貨的肉球加脈動提示 */
    if(order&&g.tier===order.tier){
      var pp=0.5+Math.sin(time*6)*0.5;
      ctx.strokeStyle='rgba(126,247,200,'+(0.25+pp*0.45)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx(i),cy(i),r+5+pp*3,0,6.2832); ctx.stroke();
    }
    if(g.tier>0) drawPaw(cx(i),cy(i),r,g.tier,sq,1,g.glow);
    else drawJunk(cx(i),cy(i),r,sq*0.5);
  }
  /* 拖曳中的肉球跟著手指 */
  if(dragIdx>=0&&grid[dragIdx]&&pd&&pd.moved){
    var dg=grid[dragIdx];
    ctx.save(); ctx.globalAlpha=0.35;
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(pd.x,pd.y+RAD[dg.tier]+8,RAD[dg.tier]*0.8,6,0,0,6.2832); ctx.fill();
    ctx.restore();
    drawPaw(pd.x,pd.y-8,RAD[dg.tier]*1.16,dg.tier,Math.sin(time*8)*0.06,1,0.4);
  }
  /* 連鎖指示 */
  if(comboN>1&&comboT>0){
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    var cs=1+Math.min(0.4,comboT*0.12);
    ctx.save();
    ctx.translate(200,GY-16); ctx.scale(cs,cs);
    F(17); ctx.fillStyle='#ffd45e';
    ctx.fillText('連鎖 x'+comboMul.toFixed(2).replace(/0$/,'')+' （'+comboN+' 連）',0,0);
    ctx.restore();
  }
}

  var msg,col='#8fb8d8';
  if(placed<2){ msg='輕點棋盤空格 → 放下肉球'; col='#ffe27a'; }
  else if(merged<1){ msg='把肉球拖到另一顆「同款」上，就會疊合升階！'; col='#ffe27a'; }
  else if(selected>=0){ msg='已選取，再點目標格（同款疊合／空格搬移／訂單卡交貨）'; col='#7ef7c8'; }
  else if(order){ msg='把「'+TIERS[order.tier].n+'」拖到上方訂單卡交貨'; col='#7ef7c8'; }
  else if(junkCount>0){ msg='焦塊擋路：交訂單清除，或用 5 階以上疊合震碎它'; col='#ffb36b'; }
  else if(time>150){ msg='後段焦塊會成對落下 — 空格就是你的命'; col='#ff9a9a'; }
  else msg='目標：疊出 '+TIERS[MAXT].n+'（第 8 階）';
  F(13,'600'); ctx.fillStyle=col;
  ctx.fillText(msg,200,578);
}

function drawFX(){
  var i;
  for(i=0;i<rings.length;i++){
    var rg=rings[i], k=rg.l/rg.m;
    ctx.globalAlpha=(1-k)*0.75;
    ctx.strokeStyle=rg.c; ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r0+(rg.r1-rg.r0)*k,0,6.2832); ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(i=0;i<flyers.length;i++){
    var f=flyers[i], k2=Math.min(1,f.t/f.m);
    var e=1-Math.pow(1-k2,3);
    var x=f.x0+(f.x1-f.x0)*e, y=f.y0+(f.y1-f.y0)*e-Math.sin(k2*3.1416)*22;
    drawPaw(x,y,RAD[f.tier]*(1-k2*0.55),f.tier,0,1-k2*0.4,0);
  }
  for(i=0;i<particles.length;i++){
    var p=particles[i], a=1-p.l/p.m;
    ctx.globalAlpha=Math.max(0,a);
    ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a+0.5,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  for(i=0;i<floats.length;i++){
    var fo=floats[i], al=1-Math.pow(fo.l/fo.m,2.2);
    ctx.globalAlpha=Math.max(0,al);
    F(fo.s); ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.55)';
    ctx.strokeText(fo.t,fo.x,fo.y);
    ctx.fillStyle=fo.c; ctx.fillText(fo.t,fo.x,fo.y);
  }
  ctx.globalAlpha=1;
}

function drawOver(){
  var k=Math.min(1,overT/0.28);
  ctx.fillStyle='rgba(8,12,18,'+(0.82*k)+')'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  var isNew=(score>=best&&score>0);
  ctx.save();
  ctx.translate(200,300); ctx.scale(0.85+0.15*k,0.85+0.15*k); ctx.translate(-200,-300);

  ctx.fillStyle='rgba(255,255,255,.06)'; rr(30,148,340,300,18); ctx.fill();
  ctx.strokeStyle=isNew?'rgba(255,226,122,.7)':'rgba(255,255,255,.14)'; ctx.lineWidth=2;
  rr(30,148,340,300,18); ctx.stroke();

  F(26); ctx.fillStyle=isNew?'#ffe27a':'#ff8b8b';
  ctx.fillText(isNew?'★ 新紀錄！★':'廚房塞爆啦！',200,192);

  F(13,'600'); ctx.fillStyle='#7f8ea0'; ctx.fillText('本局分數',200,224);
  F(50); ctx.fillStyle='#fff'; ctx.fillText(String(score),200,272);

  /* near-miss：把失敗包裝成邀請 */
  F(17); 
  if(isNew){ ctx.fillStyle='#7ef7c8'; ctx.fillText('刷新自己的紀錄，下一顆是喵神肉球嗎？',200,302); }
  else { ctx.fillStyle='#ffd45e'; ctx.fillText('差 '+(best-score)+' 分就破紀錄！',200,302); }

  drawPaw(200,348,30,runMaxTier,Math.sin(time*3)*0.05,1,0.5);
  F(14,'600'); ctx.fillStyle='#8fb8d8';
  ctx.fillText('本局最高階：'+TIERS[runMaxTier].n+'（第 '+runMaxTier+' 階）',200,394);
  F(12,'600'); ctx.fillStyle='#66748a';
  ctx.fillText('疊合 '+merged+' 次 · 交出 '+ordersDone+' 張訂單 · 撐了 '+Math.floor(time)+' 秒',200,414);
  ctx.fillStyle='#7f8ea0';
  ctx.fillText('今日最佳 '+Math.max(todayBest,score)+' 分 · 歷史最高 '+Math.max(best,score)+' 分',200,434);
  ctx.restore();

  var a=0.55+Math.sin(time*6)*0.45;
  ctx.globalAlpha=a; F(21); ctx.fillStyle='#ffe27a';
  ctx.fillText('▶ 點一下馬上再來（或按 R）',200,492);
  ctx.globalAlpha=1;
}

/* ===== 輸入 ===== */
function toLogic(e){
  var r=cv.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)/(r.width||1)*W,
    y:(e.clientY-r.top)/(r.height||1)*H
  };
}
function inOrder(x,y){ return x>=OR.x&&x<=OR.x+OR.w&&y>=OR.y&&y<=OR.y+OR.h; }

function onDown(e){
  e.preventDefault();
  ac();
  var p=toLogic(e);
  /* 靜音鈕 */
  if(p.x>366&&p.x<394&&p.y>6&&p.y<34&&state!=='title'){
    muted=!muted; if(!muted) tone(700,900,0.08,'triangle',0.12);
    pd=null; return;
  }
  pd={x:p.x,y:p.y,sx:p.x,sy:p.y,moved:false};
  if(state!=='play'){ return; }
  var i=cellAt(p.x,p.y);
  if(i>=0&&grid[i]&&grid[i].tier>0){ dragIdx=i; sPick(); }
  else dragIdx=-1;
}
function onMove(e){
  if(!pd) return;
  e.preventDefault();
  var p=toLogic(e);
  pd.x=p.x; pd.y=p.y;
  if(!pd.moved&&(Math.abs(p.x-pd.sx)>8||Math.abs(p.y-pd.sy)>8)) pd.moved=true;
}
function onUp(e){
  if(!pd){ clearInput(); return; }
  e.preventDefault();
  var p=toLogic(e);
  pd.x=p.x; pd.y=p.y;

  if(state==='title'){ reset(); clearInput(); return; }
  if(state==='over'){ if(overT>0.35) reset(); clearInput(); return; }

  if(dragIdx>=0&&pd.moved){
    /* 拖曳放開：交貨／疊合／搬移 */
    if(inOrder(p.x,p.y)) deliver(dragIdx);
    else{
      var j=cellAt(p.x,p.y);
      if(j>=0&&j!==dragIdx){
        if(grid[j]&&grid[j].tier===grid[dragIdx].tier) doMerge(dragIdx,j);
        else if(!grid[j]) moveTo(dragIdx,j);
        else sBlock();
      }
    }
    selected=-1;
  }else{
    /* 輕點：選取 → 目標 */
    tapAt(p.x,p.y);
  }
  clearInput();
}
function tapAt(x,y){
  if(inOrder(x,y)){
    if(selected>=0&&order&&grid[selected]&&grid[selected].tier===order.tier){ deliver(selected); selected=-1; }
    else if(order){ ft(200,OR.y+30,'要「'+TIERS[order.tier].n+'」才收喔','#ffb36b',14); sBlock(); }
    return;
  }
  var i=cellAt(x,y);
  if(i<0){ selected=-1; return; }
  if(selected===i){ selected=-1; return; }
  if(selected>=0&&grid[selected]){
    if(grid[i]&&grid[i].tier===grid[selected].tier) { doMerge(selected,i); selected=-1; }
    else if(!grid[i]) { moveTo(selected,i); selected=-1; }
    else if(grid[i].tier>0) selected=i;
    else { selected=-1; sBlock(); }
    return;
  }
  if(grid[i]&&grid[i].tier>0) selected=i;
  else if(!grid[i]) place(i);
  else sBlock();
}
function clearInput(){ pd=null; dragIdx=-1; }

cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',function(){ clearInput(); },{passive:false});
cv.addEventListener('pointerleave',function(){ if(pd&&!pd.moved) clearInput(); },{passive:false});
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
window.addEventListener('blur',function(){ clearInput(); selected=-1; });
document.addEventListener('visibilitychange',function(){ clearInput(); });

/* 鍵盤操作 */
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '||k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight') e.preventDefault();
  ac();
  if(state==='title'){ if(k==='Enter'||k===' ') reset(); return; }
  if(state==='over'){ if(k==='Enter'||k===' '||k==='r'||k==='R') { if(overT>0.3) reset(); } return; }
  var c=cursor%COLS, r=Math.floor(cursor/COLS);
  if(k==='ArrowLeft'||k==='a'||k==='A'){ c=Math.max(0,c-1); keyMode=true; }
  else if(k==='ArrowRight'||k==='d'||k==='D'){ c=Math.min(COLS-1,c+1); keyMode=true; }
  else if(k==='ArrowUp'||k==='w'||k==='W'){ r=Math.max(0,r-1); keyMode=true; }
  else if(k==='ArrowDown'||k==='s'||k==='S'){ r=Math.min(ROWS-1,r+1); keyMode=true; }
  else if(k==='Enter'||k===' '){ keyMode=true; tapAt(cx(cursor),cy(cursor)); return; }
  else if(k==='x'||k==='X'){ keyMode=true; if(order&&grid[cursor]&&grid[cursor].tier===order.tier) deliver(cursor); else sBlock(); return; }
  else if(k==='Escape'){ selected=-1; return; }
  else return;
  cursor=r*COLS+c;
});

/* ===== 主迴圈（固定時間步長，不受 120Hz 影響） ===== */
var last=0, acc=0;
function loop(ts){
  if(!last) last=ts;
  var dt=(ts-last)/1000; last=ts;
  if(dt>0.25) dt=0.25;
  if(dt<0) dt=0;
  acc+=dt;
  var steps=0;
  while(acc>=DT&&steps<5){ update(DT); acc-=DT; steps++; }
  if(steps>=5) acc=0;
  draw();
  requestAnimationFrame(loop);
}

load();
resize();
/* 標題畫面也要有動畫，借用 time 當計時器 */
(function initTitle(){
  for(var i=0;i<N;i++) grid[i]=null;
  queue=[1,1,1,1];
  state='title';
})();
requestAnimationFrame(loop);
/* 標題狀態下 time 不會在 update 累加，改由這裡推進 */
(function(){
  var _u=update;
  update=function(dt){ if(state==='title') time+=dt; _u(dt); };
})();
})();
</script>
