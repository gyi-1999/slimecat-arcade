<!DOCTYPE html>

<style>

  html,body{margin:0;padding:0;height:100%;background:#0e1a17;overflow:hidden;

<body>
<div id="top"><a href="../../index.html">← 回遊戲區</a></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
'use strict';

/* ============ 基本設定 ============ */
var W=400,H=600;                       // 邏輯尺寸（直式）
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var scale=1,dpr=1;

function resize(){
  var maxW=Math.min(window.innerWidth-8,460);
  var maxH=window.innerHeight-46;
  var s=Math.min(maxW/W,maxH/H);
  if(!(s>0.15)) s=0.15;
  scale=s;
  dpr=Math.min(3,window.devicePixelRatio||1);
  cv.style.width=(W*s)+'px';
  cv.style.height=(H*s)+'px';
  cv.width=Math.round(W*s*dpr);
  cv.height=Math.round(H*s*dpr);
  ctx.setTransform(s*dpr,0,0,s*dpr,0,0);   // 邏輯座標維持 400x600
  ctx.textBaseline='middle';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120);});

/* ============ 音效（WebAudio 合成，零外部資源） ============ */
var AC=null;
function ac(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext; if(!C)return null; AC=new C();}
    if(AC.state==='suspended'){var p=AC.resume(); if(p&&p.catch)p.catch(function(){});}
  }catch(e){AC=null;}
  return AC;
}
function tone(f,dur,type,vol,delay,slide){
  var a=ac(); if(!a)return;
  try{
    var t0=a.currentTime+(delay||0);
    var o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.16,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(a.destination);
    o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function noise(dur,vol,delay,lp){
  var a=ac(); if(!a)return;
  try{
    var t0=a.currentTime+(delay||0);
    var len=Math.max(1,Math.floor(a.sampleRate*dur));
    var buf=a.createBuffer(1,len,a.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    var src=a.createBufferSource();src.buffer=buf;
    var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||900;
    var g=a.createGain();g.gain.setValueAtTime(vol||0.14,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f);f.connect(g);g.connect(a.destination);
    src.start(t0);src.stop(t0+dur+0.02);
  }catch(e){}
}
function sndPlace(){tone(420,0.09,'triangle',0.10,0,300);}
function sndMerge(t,d){                       // 階數越高音越高越亮
  var f=200*Math.pow(1.19,t*2);
  tone(f,0.16,'triangle',0.16,d,f*1.5);
  tone(f*2,0.09,'sine',0.07,(d||0)+0.02);
}
function sndOrder(d){
  tone(523,0.13,'triangle',0.15,d);
  tone(659,0.13,'triangle',0.15,(d||0)+0.09);
  tone(784,0.20,'triangle',0.16,(d||0)+0.18);
  tone(1046,0.28,'sine',0.12,(d||0)+0.28);
}
function sndBad(){noise(0.24,0.16,0,700);tone(150,0.22,'sawtooth',0.10,0,80);}
function sndRot(){noise(0.30,0.14,0,500);tone(110,0.30,'square',0.07,0,70);}
function sndBoom(d){
  noise(0.55,0.26,d,1600);
  tone(90,0.5,'sawtooth',0.16,d,40);
  tone(660,0.35,'triangle',0.13,(d||0)+0.05,1400);
}
function sndRecord(){
  var s=[523,659,784,1046,1318];
  for(var i=0;i<s.length;i++)tone(s[i],0.24,'triangle',0.15,i*0.085);
}
function sndOver(){tone(330,0.30,'sine',0.14,0,150);tone(220,0.45,'sine',0.12,0.16,90);}
function sndTick(){tone(880,0.05,'sine',0.07,0);}

/* ============ 點心資料（史萊姆貓宇宙的貓咪點心鏈） ============ */
var TIERS=[null,
 {n:'喵糖球',   e:'🍬',c:'#5fbf7a',c2:'#2e7a4d'},
 {n:'肉球餅',   e:'🍪',c:'#4a9fd6',c2:'#28618c'},
 {n:'喵杯糕',   e:'🧁',c:'#a06fd8',c2:'#5e3b88'},
 {n:'貓尾丸',   e:'🍡',c:'#e08a45',c2:'#8c4d1c'},
 {n:'呼嚕布丁', e:'🍮',c:'#d9527f',c2:'#8a2b4c'},
 {n:'星塵蛋糕', e:'🍰',c:'#2fb8a8',c2:'#186b62'},
 {n:'黏黏蜜壺', e:'🍯',c:'#efc040',c2:'#96760f'},
 {n:'傳說貓罐頭',e:'🥫',c:'#ff7a3c',c2:'#a83a10'}
];
var MAXT=8;

/* ============ 盤面 ============ */
var COLS=5,ROWS=6,N=COLS*ROWS;
var CS=70,BX=25,BY=150;
function cellX(i){return BX+(i%COLS)*CS;}
function cellY(i){return BY+Math.floor(i/COLS)*CS;}
function cellCX(i){return cellX(i)+CS/2;}
function cellCY(i){return cellY(i)+CS/2;}
function cellAt(x,y){
  if(x<BX||x>=BX+COLS*CS||y<BY||y>=BY+ROWS*CS)return -1;
  var c=Math.floor((x-BX)/CS),r=Math.floor((y-BY)/CS);
  return r*COLS+c;
}
function neighbors(i){
  var r=Math.floor(i/COLS),c=i%COLS,a=[];
  if(c>0)a.push(i-1);
  if(c<COLS-1)a.push(i+1);
  if(r>0)a.push(i-COLS);
  if(r<ROWS-1)a.push(i+COLS);
  return a;
}
function around8(i){
  var r=Math.floor(i/COLS),c=i%COLS,a=[];
  for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    var rr2=r+dr,cc=c+dc;
    if(rr2<0||rr2>=ROWS||cc<0||cc>=COLS)continue;
    a.push(rr2*COLS+cc);
  }
  return a;
}
function isAdj(a,b){var ns=neighbors(a);for(var i=0;i<ns.length;i++)if(ns[i]===b)return true;return false;}

/* ============ 存檔 ============ */
var KEY='catsniff_v1';
var save={best:0,unl:[false,false,false,false,false,false,false,false,false],day:'',streak:1,cans:0};
function loadSave(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var o=JSON.parse(raw);
      if(o&&typeof o==='object'){
        if(typeof o.best==='number'&&isFinite(o.best))save.best=o.best;
        if(Object.prototype.toString.call(o.unl)==='[object Array]'&&o.unl.length===9){
          for(var i=0;i<9;i++)save.unl[i]=!!o.unl[i];
        }
        if(typeof o.day==='string')save.day=o.day;
        if(typeof o.streak==='number'&&isFinite(o.streak))save.streak=o.streak;
        if(typeof o.cans==='number'&&isFinite(o.cans))save.cans=o.cans;
      }
    }
  }catch(e){}
  // 連續造訪天數（明日再來鉤子）
  try{
    var d=new Date();
    var today=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    var y=new Date(d.getTime()-86400000);
    var yest=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    if(save.day!==today){
      save.streak=(save.day===yest)?(save.streak+1):1;
      save.day=today;
      persist();
    }
  }catch(e){}
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
loadSave();

/* ============ 遊戲狀態 ============ */
var state='title';                 // title / play / over
var grid=[],queue=[],order=null;
var score=0,ordersDone=0,ordersFail=0,turnCount=0;
var rotTimer=0,rotWarn=-1,rotCount=0;
var sel=-1,curK=12,kbShow=false;
var msg='',msgT=0,idleT=0,overT=0;
var maxTier=1,chainBest=0,recordHit=false,reported=false;
var parts=[],floats=[],ghosts=[],shake=0,pulse=0,overAnim=0;

function shuffled(n){
  var a=[],i,j,t;
  for(i=0;i<n;i++)a.push(i);
  for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function emptyCells(){var a=[],i;for(i=0;i<N;i++)if(!grid[i])a.push(i);return a;}
function pickEmpty(){var e=emptyCells();if(!e.length)return -1;return e[Math.floor(Math.random()*e.length)];}

/* 補貨：階數權重隨關卡上升（高階變多，但焦塊也變多） */
function genPiece(){
  var L=ordersDone;
  var junk=(L>=3)?Math.min(0.11,0.03*(L-2)):0;
  if(Math.random()<junk)return 0;                     // 0 = 焦塊
  var w1=Math.max(22,58-L*4),w2=30,w3=Math.min(34,6+L*4),w4=(L>=6?Math.min(14,(L-5)*3):0);
  var tot=w1+w2+w3+w4,r=Math.random()*tot;
  if(r<w1)return 1;
  if(r<w1+w2)return 2;
  if(r<w1+w2+w3)return 3;
  return 4;
}
function rotInterval(){var v=8-ordersDone;return v<3?3:v;}

function makeOrder(){
  var i=ordersDone;
  var tier=3+Math.floor(i/3); if(tier>6)tier=6;
  var turns=Math.round(15-i*0.5); if(turns<10)turns=10;
  order={tier:tier,turns:turns,max:turns};
}

function newGame(){
  grid=new Array(N);
  for(var i=0;i<N;i++)grid[i]=null;
  score=0;ordersDone=0;ordersFail=0;turnCount=0;
  rotTimer=0;rotWarn=-1;rotCount=0;
  sel=-1;curK=12;maxTier=1;chainBest=0;
  recordHit=false;reported=false;
  parts=[];floats=[];ghosts=[];shake=0;overT=0;overAnim=0;
  queue=[genPiece(),genPiece(),genPiece()];
  var s=shuffled(N);
  for(var k=0;k<6;k++)grid[s[k]]={t:(k<4?1:2),sc:0.3,blk:false};
  makeOrder();
  msg='點空格放點心，拖曳兩個相同的疊起來！';msgT=4.5;
  state='play';
}

/* ============ 特效 ============ */
function burst(x,y,col,n,pw,d){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=(0.4+Math.random())*(pw||90);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,
      life:0.5+Math.random()*0.4,max:0.9,c:col,s:2+Math.random()*3.5,d:d||0});
  }
}
function addFloat(x,y,txt,col,size,d){
  floats.push({x:x,y:y,t:txt,c:col,s:size||18,life:1.0,max:1.0,d:d||0});
}
function flyGhost(from,to,tier,d){
  ghosts.push({x0:cellCX(from),y0:cellCY(from),x1:cellCX(to),y1:cellCY(to),
    t:tier,d:d||0,life:0.20,dur:0.20});
}
function unlock(t){
  if(t>=1&&t<=MAXT&&!save.unl[t]){
    save.unl[t]=true;
    if(t>=6){addFloat(200,300,'圖鑑解鎖：'+TIERS[t].n,'#ffe9a8',20,0.1);}
    persist();
  }
}

/* ============ 行動：放置 ============ */
function place(i){
  if(state!=='play'||grid[i])return false;
  var t=queue.shift();
  queue.push(genPiece());
  grid[i]={t:t,sc:0.25,blk:(t===0)};
  turnCount++;
  if(t===0){
    sndBad();
    burst(cellCX(i),cellCY(i),'#7a6a60',10,70,0);
    msg='焦塊佔位了…完成訂單可以清掉它';msgT=2.0;
  }else{
    sndPlace();
    unlock(t);
    if(t>maxTier)maxTier=t;
    burst(cellCX(i),cellCY(i),TIERS[t].c,7,55,0);
  }
  tickRot();
  order.turns--;
  if(order.turns<=0)failOrder();
  else if(order.turns<=3){sndTick();}
  checkOver();
  return true;
}

/* 焦味蔓延：先預警一回合，玩家可以搶先把那格填掉（看得見、來得及反應） */
function tickRot(){
  if(rotWarn>=0){
    if(!grid[rotWarn]){
      grid[rotWarn]={t:0,blk:true,sc:0.3};
      rotCount++;
      sndRot();
      burst(cellCX(rotWarn),cellCY(rotWarn),'#8a6b52',14,90,0);
      shake=Math.max(shake,5);
      msg='焦味蔓延了！';msgT=1.8;
    }else{
      addFloat(cellCX(rotWarn),cellCY(rotWarn)-10,'擋下了！','#8ef0b8',17,0);
      tone(700,0.12,'triangle',0.12,0,1100);
    }
    rotWarn=-1;
  }
  rotTimer++;
  if(rotTimer>=rotInterval()){rotTimer=0;rotWarn=pickEmpty();}
}

/* ============ 行動：合成（含連鎖） ============ */
function tryMerge(from,to){
  if(state!=='play')return false;
  var a=grid[from],b=grid[to];
  if(!a||!b||a.blk||b.blk)return false;
  if(a.t!==b.t)return false;
  if(!isAdj(from,to))return false;
  doChain(from,to);
  return true;
}
function doChain(from,to){
  var chain=0,d=0,exploded=false;
  flyGhost(from,to,grid[from].t,0);
  grid[from]=null;
  var cur=grid[to];
  while(true){
    chain++;
    if(cur.t>=MAXT){explode(to,d);exploded=true;break;}
    cur.t++;
    cur.sc=1.55;
    unlock(cur.t);
    if(cur.t>maxTier)maxTier=cur.t;
    if(cur.t===MAXT)save.cans++;
    var mult=1+0.5*(chain-1);
    var gain=Math.round(4*Math.pow(2,cur.t-1)*mult);
    score+=gain;
    sndMerge(cur.t,d);
    burst(cellCX(to),cellCY(to),TIERS[cur.t].c,10+cur.t*3,70+cur.t*14,d);
    addFloat(cellCX(to),cellCY(to)-16,'+'+gain,'#ffffff',15+Math.min(9,cur.t),d);
    if(chain>1){
      addFloat(cellCX(to),cellCY(to)-38,'連鎖 x'+chain,'#ffe066',18+chain*2,d);
      shake=Math.max(shake,3+chain*1.6);
    }
    if(cur.t>=6){clearRotAround(to,d);}       // 高階合成的震波：清掉旁邊焦塊
    var nb=neighbors(to),found=-1,k;
    for(k=0;k<nb.length;k++){
      var g=grid[nb[k]];
      if(g&&!g.blk&&g.t===cur.t){found=nb[k];break;}
    }
    if(found<0)break;
    d+=0.13;
    flyGhost(found,to,cur.t,d-0.05);
    grid[found]=null;
  }
  if(chain>chainBest)chainBest=chain;
  if(!exploded&&grid[to]&&order&&grid[to].t===order.tier){
    completeOrder(to,d+0.10);
  }
  if(score>save.best&&save.best>0&&!recordHit){
    recordHit=true;sndRecord();
    addFloat(200,250,'🏆 新紀錄！','#ffd34d',30,0.05);
    for(var q=0;q<3;q++)burst(80+q*120,240,'#ffd34d',18,150,q*0.05);
    shake=Math.max(shake,9);
  }
  checkOver();
}
function clearRotAround(i,d){
  var a=around8(i),n=0;
  for(var k=0;k<a.length;k++){
    var g=grid[a[k]];
    if(g&&g.blk){grid[a[k]]=null;n++;burst(cellCX(a[k]),cellCY(a[k]),'#9ad9a0',12,90,d);}
  }
  if(n>0){
    addFloat(cellCX(i),cellCY(i)+26,'震散焦塊 x'+n,'#8ef0b8',17,d);
    tone(300,0.22,'sawtooth',0.10,d,900);
    score+=n*40;
  }
}
function explode(i,d){
  // 兩個傳說貓罐頭共鳴：大爆發清空周圍
  grid[i]=null;
  var a=around8(i),n=0;
  for(var k=0;k<a.length;k++){if(grid[a[k]]){grid[a[k]]=null;n++;burst(cellCX(a[k]),cellCY(a[k]),'#ffb066',14,120,d);}}
  score+=1200+n*60;
  sndBoom(d);
  burst(cellCX(i),cellCY(i),'#ffd34d',46,240,d);
  addFloat(200,300,'傳說共鳴！+'+(1200+n*60),'#ffd34d',26,d);
  shake=Math.max(shake,16);
}
function completeOrder(i,d){
  var t=grid[i].t;
  ghosts.push({x0:cellCX(i),y0:cellCY(i),x1:44,y1:76,t:t,d:d,life:0.42,dur:0.42});
  grid[i]=null;
  var gain=120+t*90+ordersDone*25;
  score+=gain;
  ordersDone++;
  sndOrder(d);
  addFloat(200,92,'訂單完成 +'+gain,'#ffe066',22,d+0.30);
  burst(44,76,'#ffe066',22,120,d+0.30);
  shake=Math.max(shake,7);
  // 清 2 個焦塊
  var blks=[],k;
  for(k=0;k<N;k++)if(grid[k]&&grid[k].blk)blks.push(k);
  var ord=shuffled(blks.length),cleared=0;
  for(k=0;k<ord.length&&cleared<2;k++){
    var idx=blks[ord[k]];
    grid[idx]=null;cleared++;
    burst(cellCX(idx),cellCY(idx),'#9ad9a0',12,90,d+0.32);
  }
  rotTimer=0;
  msg=cleared>0?('訂單完成！清掉 '+cleared+' 個焦塊'):'訂單完成！';
  msgT=2.4;
  makeOrder();
}
function failOrder(){
  ordersFail++;
  sndBad();shake=Math.max(shake,8);
  var e=emptyCells(),ord=shuffled(e.length),n=0;
  for(var k=0;k<ord.length&&n<2;k++){
    var i=e[ord[k]];
    grid[i]={t:0,blk:true,sc:0.3};n++;
    burst(cellCX(i),cellCY(i),'#7a6a60',12,80,0);
  }
  msg='訂單過期！長出 '+n+' 個焦塊';msgT=2.6;
  makeOrder();
}

/* ============ 結束判定 ============ */
function anyMove(){
  var i;
  for(i=0;i<N;i++)if(!grid[i])return true;
  for(i=0;i<N;i++){
    var a=grid[i];if(!a||a.blk)continue;
    var r=Math.floor(i/COLS),c=i%COLS,b;
    if(c+1<COLS){b=grid[i+1];if(b&&!b.blk&&b.t===a.t)return true;}
    if(r+1<ROWS){b=grid[i+COLS];if(b&&!b.blk&&b.t===a.t)return true;}
  }
  return false;
}
function checkOver(){
  if(state!=='play')return;
  if(anyMove())return;
  state='over';overT=0.7;overAnim=0;
  sndOver();
  if(score>save.best){save.best=score;}
  persist();
  if(!reported){
    reported=true;
    if(window.SC)SC.over(score);
  }
}

/* ============ 輸入 ============ */
function toLogic(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
var ptr={down:false,id:null,sx:0,sy:0,x:0,y:0,cell:-1,moved:false,drag:false};
function clearPtr(){ptr.down=false;ptr.drag=false;ptr.cell=-1;}

function onDown(e){
  if(e.cancelable)e.preventDefault();
  ac();
  var p=toLogic(e);
  idleT=0;
  if(state==='title'){newGame();return;}
  if(state==='over'){if(overT<=0)newGame();return;}
  ptr.down=true;ptr.id=e.pointerId;ptr.sx=p.x;ptr.sy=p.y;ptr.x=p.x;ptr.y=p.y;ptr.moved=false;
  var i=cellAt(p.x,p.y);
  ptr.cell=i;
  ptr.drag=(i>=0&&grid[i]&&!grid[i].blk)?true:false;
  kbShow=false;
}
function onMove(e){
  if(!ptr.down)return;
  if(e.cancelable)e.preventDefault();
  var p=toLogic(e);ptr.x=p.x;ptr.y=p.y;
  if(Math.abs(p.x-ptr.sx)>8||Math.abs(p.y-ptr.sy)>8)ptr.moved=true;
}
function onUp(e){
  if(!ptr.down)return;
  if(e.cancelable)e.preventDefault();
  var p=toLogic(e);
  var start=ptr.cell,moved=ptr.moved,dragging=ptr.drag;
  clearPtr();
  if(state!=='play')return;
  var j=cellAt(p.x,p.y);
  if(moved){
    if(dragging&&start>=0&&j>=0&&j!==start){
      if(tryMerge(start,j)){sel=-1;return;}
      var g=grid[j];
      if(!g)msg='要疊在「相同」的點心上喔！';
      else if(g.blk)msg='焦塊不能合成';
      else if(!isAdj(start,j))msg='只能疊到「相鄰」的格子';
      else msg='階數不同不能合成';
      msgT=1.8;tone(180,0.10,'square',0.07,0);
    }
    sel=-1;return;
  }
  actCell(j);
}
function actCell(j){
  if(state!=='play')return;
  if(j<0){sel=-1;return;}
  var g=grid[j];
  if(!g){place(j);sel=-1;return;}
  if(g.blk){msg='焦塊擋路了，完成訂單能清掉它';msgT=2.0;sel=-1;
    tone(160,0.10,'square',0.07,0);return;}
  if(sel===j){sel=-1;return;}
  if(sel>=0&&tryMerge(sel,j)){sel=-1;return;}
  sel=j;tone(600,0.05,'sine',0.07,0);
}

window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '||k==='Spacebar'||k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'){
    if(e.preventDefault)e.preventDefault();
  }
  ac();idleT=0;
  if(state==='title'){if(k==='Enter'||k===' '||k==='Spacebar')newGame();return;}
  if(state==='over'){if(overT<=0&&(k==='Enter'||k===' '||k==='Spacebar'||k==='r'||k==='R'))newGame();return;}
  kbShow=true;
  var r=Math.floor(curK/COLS),c=curK%COLS;
  if(k==='ArrowLeft'){c=(c+COLS-1)%COLS;curK=r*COLS+c;}
  else if(k==='ArrowRight'){c=(c+1)%COLS;curK=r*COLS+c;}
  else if(k==='ArrowUp'){r=(r+ROWS-1)%ROWS;curK=r*COLS+c;}
  else if(k==='ArrowDown'){r=(r+1)%ROWS;curK=r*COLS+c;}
  else if(k==='Enter'||k===' '||k==='Spacebar'){actCell(curK);}
  else if(k==='Escape'){sel=-1;}
});

/* ============ 繪圖工具 ============ */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function txt(s,x,y,size,col,align,bold){
  ctx.font=(bold?'bold ':'')+size+'px "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
  ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.fillText(s,x,y);
}
function emo(s,x,y,size){
  ctx.font=size+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign='center';ctx.fillText(s,x,y);
}

/* 焦塊：燒焦的史萊姆貓 */
function drawRot(cx,cy,s){
  var h=s/2;
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='#463b34';
  rr(-h,-h,s,s,12);ctx.fill();
  ctx.strokeStyle='#665349';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#2f2823';
  ctx.beginPath();ctx.moveTo(-h*0.6,-h);ctx.lineTo(-h*0.25,-h*1.42);ctx.lineTo(-h*0.02,-h);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(h*0.6,-h);ctx.lineTo(h*0.25,-h*1.42);ctx.lineTo(h*0.02,-h);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#c9a58a';ctx.lineWidth=2.4;ctx.lineCap='round';
  var e=s*0.11;
  [[-s*0.16,-s*0.04],[s*0.16,-s*0.04]].forEach(function(p){
    ctx.beginPath();ctx.moveTo(p[0]-e,p[1]-e);ctx.lineTo(p[0]+e,p[1]+e);
    ctx.moveTo(p[0]+e,p[1]-e);ctx.lineTo(p[0]-e,p[1]+e);ctx.stroke();
  });
  ctx.strokeStyle='#8c6f5d';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(-s*0.14,s*0.20);ctx.quadraticCurveTo(0,s*0.10,s*0.14,s*0.20);ctx.stroke();
  ctx.restore();
}
/* 點心：史萊姆貓造型底座 + 點心 emoji */
function drawItem(cx,cy,size,tier,alpha){
  if(tier===0){ctx.globalAlpha=alpha===undefined?1:alpha;drawRot(cx,cy,size);ctx.globalAlpha=1;return;}
  var d=TIERS[tier];if(!d)return;
  var h=size/2;
  ctx.save();ctx.translate(cx,cy);
  ctx.globalAlpha=alpha===undefined?1:alpha;
  if(tier>=6){
    ctx.shadowColor=d.c;ctx.shadowBlur=14+Math.sin(pulse*4)*5;
  }
  var g=ctx.createLinearGradient(0,-h,0,h);
  g.addColorStop(0,d.c);g.addColorStop(1,d.c2);
  ctx.fillStyle=g;
  // 貓耳
  ctx.beginPath();ctx.moveTo(-h*0.62,-h*0.62);ctx.lineTo(-h*0.30,-h*1.34);ctx.lineTo(0,-h*0.66);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(h*0.62,-h*0.62);ctx.lineTo(h*0.30,-h*1.34);ctx.lineTo(0,-h*0.66);ctx.closePath();ctx.fill();
  rr(-h,-h,size,size,size*0.28);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.30)';ctx.lineWidth=1.6;
  rr(-h+1,-h+1,size-2,size-2,size*0.27);ctx.stroke();
  // 高光
  ctx.fillStyle='rgba(255,255,255,.20)';
  rr(-h+4,-h+4,size-8,size*0.30,size*0.16);ctx.fill();
  ctx.fillStyle='#ffffff';
  emo(d.e,0,size*0.04,size*0.50);
  // 階數
  ctx.fillStyle='rgba(0,0,0,.42)';
  rr(h-17,h-14,15,12,5);ctx.fill();
  txt(String(tier),h-9.5,h-8,10,'#ffffff','center',true);
  ctx.globalAlpha=1;
  ctx.restore();
}
/* 標題用史萊姆貓吉祥物 */
function mascot(cx,cy,s){
  ctx.save();ctx.translate(cx,cy);
  var g=ctx.createRadialGradient(-s*0.2,-s*0.3,s*0.1,0,0,s);
  g.addColorStop(0,'#9df0b4');g.addColorStop(1,'#3aa36a');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(-s*0.62,-s*0.42);ctx.lineTo(-s*0.34,-s*1.05);ctx.lineTo(-s*0.02,-s*0.5);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(s*0.62,-s*0.42);ctx.lineTo(s*0.34,-s*1.05);ctx.lineTo(s*0.02,-s*0.5);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,s*0.78,s*0.66,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#12352a';
  ctx.beginPath();ctx.ellipse(-s*0.26,-s*0.06,s*0.09,s*0.12,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*0.26,-s*0.06,s*0.09,s*0.12,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#12352a';ctx.lineWidth=2.2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-s*0.12,s*0.20);ctx.quadraticCurveTo(0,s*0.32,s*0.12,s*0.20);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath();ctx.ellipse(-s*0.30,-s*0.32,s*0.18,s*0.10,-0.4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ============ 更新 ============ */
var STEP=1/60,acc=0,last=0;
function update(dt){
  pulse+=dt;
  if(msgT>0)msgT-=dt;
  if(overT>0)overT-=dt;
  if(state==='over')overAnim=Math.min(1,overAnim+dt*3);
  if(state==='play')idleT+=dt;
  if(shake>0){shake-=dt*34;if(shake<0)shake=0;}
  var i;
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    if(p.d>0){p.d-=dt;continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=430*dt;p.vx*=0.985;
    p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){
    var f=floats[i];
    if(f.d>0){f.d-=dt;continue;}
    f.y-=32*dt;f.life-=dt;
    if(f.life<=0)floats.splice(i,1);
  }
  for(i=ghosts.length-1;i>=0;i--){
    var gh=ghosts[i];
    if(gh.d>0){gh.d-=dt;continue;}
    gh.life-=dt;
    if(gh.life<=0)ghosts.splice(i,1);
  }
  for(i=0;i<N;i++){
    var c=grid[i];
    if(c&&c.sc!==1){
      c.sc+=(1-c.sc)*Math.min(1,dt*15);
      if(Math.abs(c.sc-1)<0.006)c.sc=1;
    }
  }
  if(parts.length>420)parts.splice(0,parts.length-420);
}

function drawBoard(){
  var i,k;
  // 格子底
  for(i=0;i<N;i++){
    ctx.fillStyle='rgba(255,255,255,.045)';
    rr(cellX(i)+3,cellY(i)+3,CS-6,CS-6,12);ctx.fill();
  }
  // 焦味預警格
  if(rotWarn>=0&&!grid[rotWarn]){
    var a=0.4+0.35*Math.sin(pulse*7);
    ctx.strokeStyle='rgba(255,130,70,'+a+')';ctx.lineWidth=3;
    ctx.setLineDash([7,5]);
    rr(cellX(rotWarn)+4,cellY(rotWarn)+4,CS-8,CS-8,12);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,150,90,'+a+')';
    txt('焦',cellCX(rotWarn),cellCY(rotWarn),22,'rgba(255,150,90,'+a+')','center',true);
  }
  // 合成提示（拖曳中或選取中）
  var src=ptr.drag?ptr.cell:sel;
  if(src>=0&&grid[src]&&!grid[src].blk){
    var ns=neighbors(src);
    for(k=0;k<ns.length;k++){
      var g2=grid[ns[k]];
      if(g2&&!g2.blk&&g2.t===grid[src].t){
        ctx.strokeStyle='rgba(140,255,190,'+(0.55+0.35*Math.sin(pulse*8))+')';
        ctx.lineWidth=3;rr(cellX(ns[k])+3,cellY(ns[k])+3,CS-6,CS-6,12);ctx.stroke();
      }
    }
    ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2.5;
    rr(cellX(src)+3,cellY(src)+3,CS-6,CS-6,12);ctx.stroke();
  }
  // 閒置時的溫和提示
  if(idleT>7&&state==='play'){
    outer:
    for(i=0;i<N;i++){
      var a2=grid[i];if(!a2||a2.blk)continue;
      var ns2=neighbors(i);
      for(k=0;k<ns2.length;k++){
        var b2=grid[ns2[k]];
        if(b2&&!b2.blk&&b2.t===a2.t){
          ctx.strokeStyle='rgba(255,255,255,'+(0.15+0.20*Math.sin(pulse*5))+')';
          ctx.lineWidth=2;
          rr(cellX(i)+3,cellY(i)+3,CS-6,CS-6,12);ctx.stroke();
          rr(cellX(ns2[k])+3,cellY(ns2[k])+3,CS-6,CS-6,12);ctx.stroke();
          break outer;
        }
      }
    }
  }
  // 鍵盤游標
  if(kbShow){
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    rr(cellX(curK)+2,cellY(curK)+2,CS-4,CS-4,13);ctx.stroke();ctx.setLineDash([]);
  }
  // 物件
  for(i=0;i<N;i++){
    var c=grid[i];if(!c)continue;
    var hide=(ptr.drag&&ptr.moved&&ptr.cell===i);
    if(hide)continue;
    drawItem(cellCX(i),cellCY(i),(CS-12)*c.sc,c.t,1);
  }
}

  txt('完成訂單',74,362,12,'#8fd6b4','left',false);
  txt(ordersDone+' 張',74,384,20,'#ffffff','left',true);
  txt('最長連鎖',186,362,12,'#8fd6b4','left',false);
  txt('x'+chainBest,186,384,20,'#ffffff','left',true);
  txt('最高階',290,362,12,'#8fd6b4','left',false);
  drawItem(312,392,34,maxTier,1);
  txt(TIERS[maxTier].n,200,420,13,'#cfeee0','center',false);
  var a=0.6+0.4*Math.sin(pulse*3.6);
  ctx.globalAlpha=overAnim*a;
  ctx.fillStyle='#3fbf82';rr(110,452,180,46,23);ctx.fill();
  ctx.globalAlpha=overAnim;
  txt('再來一局',200,475,20,'#07231a','center',true);
  txt('點任何地方（或按 R）立刻重開',200,516,13,'#9ad9bd','center',false);
  txt('明天再來，連續造訪就能繼續累積：'+save.streak+' 天',200,544,12,'#7fbba1','center',false);
  txt('最高分 '+save.best,200,568,12,'#5f9c84','center',false);
  ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  drawBG();
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  if(state!=='title'){
    drawHUD();drawBoard();drawFX();drawMsg();
  }
  ctx.restore();
  if(state==='title')drawTitle();
  else if(state==='over')drawOver();
}

/* ============ 主迴圈：固定時間步長 ============ */
function frame(now){
  if(!last)last=now;
  var dt=(now-last)/1000;last=now;
  if(dt>0.25)dt=0.25;
  if(dt<0)dt=0;
  acc+=dt;
  var guard=0;
  while(acc>=STEP&&guard<8){update(STEP);acc-=STEP;guard++;}
  if(guard>=8)acc=0;
  try{draw();}catch(e){}
  requestAnimationFrame(frame);
}

resize();
newGame();
state='title';
requestAnimationFrame(frame);
})();
